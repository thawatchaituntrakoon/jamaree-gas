name: Auto Deploy to VPS

on:
  push:
    branches:
      - main  # เปลี่ยนเป็น master ถ้าคุณใช้ branch ชื่อ master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            # ระบุตำแหน่งโฟลเดอร์โปรเจกต์ของคุณใน VPS
            cd /root/jamaree-gas/jamaree-web/
            
            # ดึงโค้ดล่าสุด
            git pull origin main
            
            # สั่ง Build และรัน Docker ใหม่
            docker compose down
            docker compose up -d --build