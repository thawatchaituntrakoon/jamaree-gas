name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# กัน deploy ซ้อนกันถ้า push ติด ๆ กัน
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & restart on VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || vars.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd /root/jamaree-gas-admin
            git pull origin main
            cd jamaree-web
            # คีย์ Supabase ต้องมีตอน build (Vite ฝังค่าลงไฟล์ตอนสร้าง)
            docker compose --env-file .env.local up -d --build
            docker image prune -f
            docker compose ps
