<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAMAREE GAS</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Bai+Jamjuree:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#16192d; --muted:#5b6172; --faint:#9aa0b4; --line:#e6e8ef;
 --paper:#f6f8fc; --card:#ffffff; --accent:#2563eb; --accent2:#0d9488;
 --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
 --sh:0 1px 2px rgba(22,25,45,.05),0 8px 24px -16px rgba(22,25,45,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Anuphan",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
h1,h2,h3,.disp{font-family:"Bai Jamjuree",sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}

/* ============ sidebar (โทน+แพตเทิร์นเดียวกับ HomeOffice) ============ */
.app-shell{display:flex;align-items:stretch;min-height:100vh}
.sidebar{width:230px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;margin-bottom:8px;border-bottom:1px solid var(--line);min-width:0}
.sidebar-brand .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.sidebar-brand b{font-family:"Bai Jamjuree";font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sidebar-brand b:hover{color:var(--accent)}

.navgroup{margin-bottom:2px}
.navgroup .gt{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 11px 6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:transparent;width:100%;text-align:left;transition:.12s}
.nav-i .ic{font-size:15px;width:18px;text-align:center;flex:none}
.nav-i:hover{background:rgba(22,25,45,.05);color:var(--ink)}
.nav-i.on{background:rgba(37,99,235,.1);color:var(--accent)}

.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sidebar-foot button{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:8px 11px;text-align:left;width:100%}
.sidebar-foot button:hover{background:rgba(22,25,45,.05);color:var(--accent)}

.main-col{flex:1;min-width:0}
.sidebar-backdrop{display:none}
.hamburger{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.topbar-mobile{display:none}
@media(max-width:820px){
 .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:.22s;box-shadow:0 20px 50px -20px rgba(22,25,45,.4);z-index:60}
 body.sidebar-open .sidebar{transform:none}
 body.sidebar-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(22,25,45,.42);z-index:55}
 .topbar-mobile{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
 .topbar-mobile b{font-family:"Bai Jamjuree";font-size:15px}
}

main{padding:24px 0 80px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h2{font-size:22px}
.pagehead .sub{font-size:13.5px;color:var(--muted);margin-top:2px}

.btn{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:11px;padding:10px 17px}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#b91c1e}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px 20px}
.card .ch{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.card .ch .btn,.card .ch .lnk{white-space:nowrap}
.card .ch .dot{width:9px;height:9px;border-radius:50%}
.stat .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{font-family:"Bai Jamjuree";font-size:25px;font-weight:700;display:block;margin-top:3px}
.money-pos{color:var(--ok)} .money-neg{color:var(--danger)}

.rowlist{display:flex;flex-direction:column}
.rowlist .li{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.rowlist .li:first-child{border-top:0}
.rowlist .li .main{flex:1;min-width:0}
.rowlist .li .t{font-weight:600;font-size:14.5px}
.rowlist .li .m{font-size:12.5px;color:var(--muted);margin-top:1px}
.rowlist .empty{color:var(--faint);font-size:13.5px;padding:14px 0;text-align:center}

.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-พอ{background:#e9f7ef;color:#15803d}.c-ใกล้หมด{background:#fef6e7;color:#b45309}.c-หมด{background:#fdecec;color:#c0392b}
.c-รับเข้า{background:#e9f7ef;color:#15803d}.c-เบิกออก{background:#fdecec;color:#c0392b}
.c-ใหม่{background:#eff4ff;color:#2563eb}.c-เสร็จ{background:#e9f7ef;color:#15803d}
.c-ร่าง{background:#fef6e7;color:#b45309}.c-ส่งแล้ว{background:#eff4ff;color:#2563eb}
.c-ชำระแล้ว{background:#e9f7ef;color:#15803d}.c-จ่ายแล้ว{background:#e9f7ef;color:#15803d}
.c-ปรับเพิ่ม{background:#e9f7ef;color:#15803d}.c-ปรับลด{background:#fdecec;color:#c0392b}
.c-สั่งแล้ว{background:#eff4ff;color:#2563eb}.c-รับแล้ว{background:#e9f7ef;color:#15803d}.c-ยกเลิก{background:#fdecec;color:#c0392b}
.c-ปิดใช้งาน{background:#eef0f4;color:#5b6172}
.c-บริการ{background:#eef0f4;color:#5b6172}
.c-สด{background:#e9f7ef;color:#15803d}.c-เชื่อ{background:#fef6e7;color:#b45309}.c-โอน{background:#eff4ff;color:#2563eb}
.c-รอส่งคืน{background:#fef6e7;color:#b45309}.c-ไม่มีค้าง{background:#eef0f4;color:#5b6172}

/* แถบเตือนสำรองข้อมูล — เหนือเนื้อหาทุกแท็บ โผล่เงียบ ๆ ไม่ popup */
.backup-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px;font-weight:600;padding:10px 14px;border-radius:11px;margin-bottom:16px;flex-wrap:wrap}
.backup-banner button{white-space:nowrap}

/* ค้นหากลาง — ใต้ brand บน sidebar */
.boardwrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:900px){.boardwrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.boardwrap{grid-template-columns:1fr}}
.boardcol{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:90px}
.bch{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:0 2px;white-space:nowrap}
.bcount{background:var(--line);color:var(--ink);border-radius:20px;padding:1px 8px;font-size:11.5px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(22,25,45,.04)}
.bcard:hover{border-color:var(--accent)}
.bcard.late{border-left:3px solid var(--danger)}
.bcard .bico{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--muted)}
.bcard .bt{font-size:13.5px;font-weight:600;line-height:1.4}
.bcard .bs{font-size:12px;color:var(--muted);margin-top:3px}
.bcard .bmeta{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.bdue{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bdue.late{color:var(--danger);font-weight:700}
.bempty{font-size:12px;color:var(--faint);text-align:center;padding:14px 0}
.rolebox{padding:0 4px 12px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.rolebox label{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--faint);text-transform:uppercase;margin-bottom:5px}
.rolebox select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);background:#fff;font-family:inherit}
.rolebox select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.rolewarn{margin-top:8px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:7px 9px;font-size:11px;line-height:1.5;color:#92400e}
.sidebar-search{position:relative;padding:0 4px 10px}
.sidebar-search input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;color:var(--ink);background:#fff}
.sidebar-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-drop{position:absolute;left:4px;right:4px;top:calc(100% - 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 40px -16px rgba(22,25,45,.35);z-index:70;max-height:360px;overflow-y:auto;padding:6px}
.search-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:8px 9px;font-size:13.5px;color:var(--ink)}
.search-item:hover{background:rgba(37,99,235,.08)}
.search-item .ic{font-size:15px;flex:none;width:20px;text-align:center}
.search-item .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.search-item .tx b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-item .tx small{color:var(--muted);font-size:11.5px}
.search-empty{padding:12px 10px;color:var(--faint);font-size:12.5px;text-align:center}

.tbl{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.tbl-scroll{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 15px;background:#fafbfd;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 15px;font-size:14.5px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafbfd}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .act{text-align:right;white-space:nowrap}
.lnk{color:var(--muted);font-size:13px;background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:7px}
.lnk:hover{color:var(--accent);background:rgba(37,99,235,.06)}
.lnk.del:hover{color:var(--danger);background:rgba(220,38,38,.06)}
.tbl .lnk{color:var(--muted);font-size:13px;background:none;border:0;padding:4px 6px}
.tbl .lnk:hover{color:var(--accent)} .tbl .lnk.del:hover{color:var(--danger)}
.tblempty{padding:34px;text-align:center;color:var(--faint)}

.ov{position:fixed;inset:0;background:rgba(22,25,45,.42);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:460px;padding:22px 22px 20px;box-shadow:0 30px 60px -20px rgba(22,25,45,.5);max-height:90vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.frow{display:flex;gap:10px}.frow .fld{flex:1}
.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.mfoot .btn.ghost{border-color:var(--line);color:var(--muted)}
/* select/input เดี่ยว ๆ นอกฟอร์ม .fld (เช่น dropdown เลือกเดือนในหัวข้อ, dropdown ในตาราง) — โค้งมนขอบเดียวกับ .fld */
.sel{border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--ink);background:#fff;font-family:inherit;font-size:13.5px}
.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
input[type=checkbox]{accent-color:var(--accent)}
/* ปุ่มชื่อพนักงานในจอ Kiosk — ใหญ่ กดง่าย หน้าตาเดียวกันทุกใบ */
.kiosk-btn{text-align:left;padding:18px 20px;font-size:17px;border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;color:var(--ink);border:1.5px solid var(--line)}

/* แถวปุ่มกดเดี๋ยวนี้ข้าง ๆ ช่องเลือก (เช่น เช็คอิน-ออกเร็ว) — ปุ่มห้ามถูกบีบจนตัวหนังสือแตกบรรทัด */
.qp-row .qp-btn{flex:none}
.qp-row .qp-btn .btn{white-space:nowrap}
@media(max-width:480px){
 .qp-row{flex-wrap:wrap}
 .qp-row .fld{flex:1 1 100%}
}

/* หน้าว่างตอนเริ่ม */
.blankstart{text-align:center;padding:70px 20px;color:var(--muted)}
.blankstart .em{font-size:46px}
.blankstart h2{font-size:23px;margin:14px 0 6px;color:var(--ink)}
.blankstart p{font-size:15px;max-width:46ch;margin:0 auto}
.blankstart code{font-family:"Bai Jamjuree";background:rgb(37 99 235/.08);color:var(--accent);padding:2px 9px;border-radius:7px;font-size:14px}

/* ============ ปรับหน้าตาให้เป็นมืออาชีพ (house style) ============
   เงาบางลง เส้นจางลง จังหวะช่องไฟสม่ำเสมอ · ไอคอนเส้นแทน emoji · เมนู active เป็นบล็อกทึบ */
.sidebar-brand .mk{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;flex:none;overflow:hidden}
.sidebar-search{position:relative}
.sidebar-search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;display:flex;z-index:1}
.sidebar-search input{padding-left:36px !important}
nav#tabbar .nav-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;
 color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:500;padding:8px 11px;border-radius:9px;margin:1px 0;cursor:pointer;
 white-space:nowrap;transition:background .12s,color .12s}
nav#tabbar .nav-i:hover{background:rgba(22,25,45,.05);color:var(--ink)}
nav#tabbar .nav-i.on{background:var(--ink);color:#fff;font-weight:600}
nav#tabbar .nav-i .ic{display:flex;align-items:center;flex:none;opacity:.85}
nav#tabbar .nav-i.on .ic{opacity:1}
nav#tabbar .navgroup{margin-bottom:10px}
nav#tabbar .gt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 11px 5px}
.sidebar-foot button{display:flex;align-items:center;gap:9px}
.sidebar-foot button svg{flex:none;opacity:.8}
/* การ์ด/ตาราง: เงาบาง เส้นจาง มุมสม่ำเสมอ */
.card,.tbl{border-radius:14px;border:1px solid rgba(26,32,50,.09);box-shadow:0 1px 2px rgba(26,32,50,.04)}
.card{padding:18px 20px}
.ch{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:12px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{font-family:'Bai Jamjuree',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
table th{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
 padding:11px 13px;border-bottom:1px solid rgba(26,32,50,.09);white-space:nowrap}
table td{padding:11px 13px;border-bottom:1px solid rgba(26,32,50,.06);font-size:13.5px;vertical-align:middle}
table tbody tr:last-child td{border-bottom:0}
table tbody tr:hover{background:rgba(37,99,235,.03)}
td.act{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
/* สถิติบนแดชบอร์ด */
.card.stat .lab{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.card.stat b{font-family:'Bai Jamjuree',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em;display:block}
/* ปุ่ม */
.btn{font-weight:600;letter-spacing:0;transition:filter .12s,transform .06s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.sm{font-size:12.5px;padding:6px 12px}
/* หน้าว่าง */
.tblempty,.empty{color:var(--faint);text-align:center;padding:34px 16px;font-size:13.5px}
.blankstart{text-align:center;padding:64px 20px;max-width:460px;margin:0 auto}
.blankstart .em{font-size:34px;margin-bottom:12px;opacity:.5}
.blankstart h2{font-family:'Bai Jamjuree',sans-serif;font-size:20px;margin-bottom:8px}
.blankstart p{color:var(--muted);font-size:14px;line-height:1.7}
/* ฟอร์ม */
.fld label{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:6px;display:block}
.fld input,.fld select,.fld textarea{border-radius:10px;border:1.5px solid rgba(26,32,50,.12);padding:10px 12px;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.mfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid rgba(26,32,50,.08)}
</style>
</head>
<body>

<div class="app-shell">
 <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
 <aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
   <div class="mk"></div>
   <b id="shopName" title="คลิกเพื่อแก้ชื่อร้าน">JAMAREE GAS</b>
  </div>
  <div class="sidebar-search">
   <span class="si"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14"/><path d="M20 20l-4-4"/></svg></span>

function normalizeDb(){
 // กันพัง: ถ้าไฟล์เก่าไม่มี array บางตัว เติมให้ครบเสมอ
 ["products","moves","customers","orders","money","docs","staff","timelogs","leaves","payrolls","otlogs","shifts","holidays","monthCloses"].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; });
 if(!db.shopName) db.shopName="JAMAREE GAS";
 if(!db.bizInfo || typeof db.bizInfo!=="object") db.bizInfo={address:"",taxId:"",vatRegistered:false,promptpayMobile:"",promptpayId:"",branch:"สำนักงานใหญ่"};
 if(db.bizInfo.vatRegistered===undefined) db.bizInfo.vatRegistered=false;
 if(db.bizInfo.promptpayMobile===undefined) db.bizInfo.promptpayMobile="";
 if(db.bizInfo.promptpayId===undefined) db.bizInfo.promptpayId="";
 if(!db.bizInfo.branch) db.bizInfo.branch="สำนักงานใหญ่";
 if(!db.docCounters || typeof db.docCounters!=="object") db.docCounters={};
 if(!Array.isArray(db.leaveTypes) || !db.leaveTypes.length) db.leaveTypes=["ลากิจ","ลาป่วย","ลาพักร้อน"];
 if(!db.leaveQuota || typeof db.leaveQuota!=="object") db.leaveQuota={ลากิจ:6,ลาป่วย:30,ลาพักร้อน:6};
 db.leaveTypes.forEach(t=>{ if(db.leaveQuota[t]===undefined) db.leaveQuota[t]=6; });
 if(!db.workStart) db.workStart="09:00";
 if(!db.shifts.length) db.shifts=[{id:"sh_default", name:"กะปกติ", start:"09:00", end:"18:00"}];
 if(!db.categories || typeof db.categories!=="object") db.categories={in:[],out:[]};
 if(!Array.isArray(db.categories.in)) db.categories.in=[];
 if(!Array.isArray(db.categories.out)) db.categories.out=[];
 if(!db.categories.in.length && !db.categories.out.length){
  db.categories={in:["ขาย","อื่นๆ"], out:["วัตถุดิบ","ค่าเช่า","เงินเดือน","ค่าใช้จ่าย","อื่นๆ"]};
 }
 // เติม field ใหม่ให้ staff/customers เก่าที่ยังไม่มี (กันพัง)
 db.staff.forEach(s=>{
  if(s.nickname===undefined) s.nickname="";

/* ============ registry โมดูล — แต่ละก้อนที่เราสร้างจะ "ลงทะเบียน" แท็บไว้ที่นี่ ============ */

/* ============ สิทธิ์การเข้าถึง (3 บทบาท) ============
   🚨 อ่านก่อนแก้: นี่คือ "แบ่งหน้าจอตามหน้าที่" ไม่ใช่ "ล็อกข้อมูล"
   ข้อมูลทั้งหมดอยู่ใน localStorage ของเครื่องที่เปิดอยู่ ใครกด F12 ก็เปลี่ยนบทบาทตัวเองได้ใน 5 วินาที
   จะกันได้จริงต้องมีเซิร์ฟเวอร์ตรวจสิทธิ์ฝั่งหลังบ้าน (ระดับ ③ — Supabase + ล็อกอินจริง)
   ห้ามถอดข้อความเตือนในตัวสลับบทบาทออก คนใช้ต้องรู้ว่าอันนี้ไม่ใช่ของจริง */
const ROLE_LABEL={owner:"เจ้าของ", manager:"หัวหน้า", staff:"พนักงาน"};
const ROLE_TABS={
 owner:  ["dash","board","customers","orders","docs","products","purchases","money","staff","attendance","payroll"],
 manager:["dash","board","customers","orders","docs","products","purchases","staff","attendance"],
 staff:  ["board","attendance"]
};
function actingStaff(){ return db.actingAs ? db.staff.find(s=>s.id===db.actingAs) : null; }
function currentRole(){ const s=actingStaff(); return s ? (s.accessRole||"staff") : "owner"; }
function canTab(key){ return ROLE_TABS[currentRole()].includes(key); }
/* เห็นตัวเลขเงินของ "คนอื่น" ได้ไหม (เงินเดือน/เลขบัญชี/บัตรประชาชน/ต้นทุน) — เจ้าของเท่านั้น */
function canSeeMoney(){ return currentRole()==="owner"; }
/* ขอบเขตคนที่มองเห็น: เจ้าของ=ทุกคน · หัวหน้า=แผนกตัวเอง · พนักงาน=ตัวเองคนเดียว */
function visibleStaffIds(){
 const me=actingStaff();
 if(!me) return db.staff.map(s=>s.id);
 if(me.accessRole==="manager") return db.staff.filter(s=>(s.dept||"")===(me.dept||"")).map(s=>s.id);
 return [me.id];
}
function canSeeStaff(id){ return visibleStaffIds().includes(id); }
function switchActingAs(v){

 if(!allowed.includes(cur)) cur=allowed[0];

}
function roleSwitcherHtml(){

function tabs(){
 const rolebox=document.getElementById("rolebox");

  const items=g.keys.filter(canTab).map(k=>MODULES.find(m=>m.key===k)).filter(Boolean);
  if(!items.length) return "";
  return `<div class="navgroup"><div class="gt">${g.label}</div>${items.map(m=>
   `<button class="nav-i ${m.key===cur?'on':''}" onclick="go('${m.key}')"><span class="ic">${icon(m.ic)}</span>${m.label}</button>`).join("")}</div>`;
 }).join("");
}

 if(!MODULES.length){
  view.innerHTML=`<div class="blankstart"><div class="em">${icon('hammer',34)}</div>

   <p>วางพรอมต์ก้อนที่ 1 ที่ผู้สอนฉายบนจอ ลงใน Claude Code แล้วรีเฟรชหน้านี้ — แท็บ <code>สินค้า</code> จะโผล่ขึ้นมา</p></div>`;

function prodStatus(p){
 if(p.kind==='บริการ') return "บริการ";
 if(p.kind==='ชำรุด') return p.stock>0 ? "รอส่งคืน" : "ไม่มีค้าง";
 const avail=gasAvailable(p);
 if(avail<=0) return "หมด";
 if(avail<=p.lowAt) return "ใกล้หมด";
 return "พอ";
}

registerModule({key:"products", ic:"products", label:"สินค้า", render:renderProducts});

function renderProducts(){
 // ⭐ แท็บนี้เน้น "ขายน้ำแก๊ส" ล้วนๆ — ถังเปล่า/ถังใหม่ (kind='เปล่า'/'ใหม่') ไม่ใช่ของขายหน้าร้านปกติ
 //   ถังเปล่าผูกกับระบบยืม/คืน/ฝากถังของลูกค้า · ถังใหม่ใช้เฉพาะตอน "เปลี่ยนถังชำรุด" ในหน้าลูกค้า

 const visible=db.products.filter(p=>p.kind!=='เปล่า' && p.kind!=='ใหม่');
 // น้ำแก๊สไม่นับเป็น "ของใกล้หมด" ที่ต้องสั่งซื้อ — ตัวจริงที่ต้องเติมคือแก๊สดิบ ซึ่งจะเตือนของมันเองอยู่แล้ว
 const lowCount=visible.filter(p=>p.kind!=='บริการ' && p.kind!=='ชำรุด' && p.kind!=='น้ำแก๊ส' && p.active!==false && p.stock<=p.lowAt).length;
 let html=`<div class="pagehead"><div><h2>สินค้า</h2><div class="sub">ทะเบียนสินค้าและคงเหลือ (น้ำแก๊ส/อุปกรณ์/บริการ)</div></div>

   <button class="btn ghost" onclick="openStocktake()">ตรวจนับสต๊อก</button>
   <button class="btn" onclick="openProductForm()">+ เพิ่ม</button>
  </div></div>`;
 if(!visible.length) return html+empty("ยังไม่มีสินค้า — กดปุ่ม + เพิ่ม");
 const rows=visible.map(p=>{
  const st=prodStatus(p);
  const isSvc=p.kind==='บริการ';
  const isGas=p.kind==='น้ำแก๊ส';
  const profit=(Number(p.price)||0)-(Number(p.cost)||0);   // คำนวณสดตอน render — ไม่เก็บลง db
  const pcls=profit>=0?'money-pos':'money-neg';
  const inactive=p.active===false;
  const kindLabel = p.kind ? esc(p.kind)+(p.size?' '+esc(p.size):'') : '—';
  const hasMoves=db.moves.some(m=>m.productId===p.id);
  const delOrToggleBtn = hasMoves
   ? `<button class="lnk" onclick="toggleProductActive('${p.id}')">${inactive?'เปิดใช้งาน':'ปิดใช้งาน'}</button>`
   : `<button class="lnk del" onclick="delRow('products','${p.id}')">ลบ</button>`;
  return `<tr style="${inactive?'opacity:.5':''}">
   <td>${esc(p.sku||"")}</td>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openProductDetail('${p.id}')">${esc(p.name)}</button>${inactive?' <span class="chip c-ปิดใช้งาน">ปิดใช้งาน</span>':''}</td>
   <td>${kindLabel}</td>
   <td class="num">${isSvc?'—':gasAvailable(p)}</td>

    <button class="lnk" onclick="openProductForm('${p.id}')">แก้</button>
    ${delOrToggleBtn}
   </td>
  </tr>`;
 }).join("");
 // มูลค่าสต๊อกเคยอยู่ในแท็บบัญชี — ย้ายมาอยู่ใต้ตารางสินค้าตอนตัดเหลือ 9 แท็บ (มันเป็นเรื่องของคลัง ไม่ใช่บัญชี)

}

   'เปล่า'=หมวดถังแก๊ส ผูกกับระบบยืม/คืน/ฝากถังเท่านั้น ไม่เกี่ยวกับการขาย/บรรจุแก๊ส · 'บริการ'=ไม่มีสต๊อกจริง ขายได้อย่างเดียว ไม่ตัด/ไม่เช็คคงเหลือ */

function onProductKindChange(){
 const kind=val("p_kind");
 const isCyl = kind==='เปล่า' || kind==='น้ำแก๊ส' || kind==='ใหม่' || kind==='ชำรุด';
 const isGas = kind==='น้ำแก๊ส';
 const isSvc = kind==='บริการ';
 const sizeRow=document.getElementById("p_sizeRow"); if(sizeRow) sizeRow.style.display = isCyl?"":"none";
 const fillFld=document.getElementById("p_fillKgFld"); if(fillFld) fillFld.style.display = isGas?"":"none";
 const stockOnlyFld=document.getElementById("p_stockOnlyFld"); if(stockOnlyFld) stockOnlyFld.style.display = (isSvc||isGas)?"none":"";
 const lowFld=document.getElementById("p_lowFld"); if(lowFld) lowFld.style.display = isSvc?"none":"";
 const gasNote=document.getElementById("p_gasAutoNote"); if(gasNote) gasNote.style.display = isGas?"":"none";
 const priceLabel=document.getElementById("p_priceLabel"); if(priceLabel) priceLabel.textContent = isGas?"ราคาขายแลกถัง":"ราคาขาย";
}

function saveProduct(id){
 const name=val("p_name");
 if(!name) return;
 const kind=val("p_kind")||undefined;
 const isSvc=kind==='บริการ';
 const isGas=kind==='น้ำแก๊ส';
 const size=(kind==='เปล่า'||kind==='น้ำแก๊ส'||kind==='ใหม่'||kind==='ชำรุด')?(val("p_size")||undefined):undefined;
 const fillKg=isGas?(Number(val("p_fillKg"))||undefined):undefined;
 if(id){
  const p=db.products.find(x=>x.id===id);
  if(p){ p.sku=val("p_sku"); p.name=name; p.unit=val("p_unit"); p.lowAt=isSvc?0:(Number(val("p_low"))||0); p.price=Number(val("p_price"))||0; p.cost=Number(val("p_cost"))||0;
   p.kind=kind; p.size=size; p.fillKg=fillKg; }
 }else{
  db.products.push({id:uid(), sku:val("p_sku"), name, unit:val("p_unit"), stock:(isSvc||isGas)?0:(Number(val("p_stock"))||0), lowAt:isSvc?0:(Number(val("p_low"))||0), price:Number(val("p_price"))||0, cost:Number(val("p_cost"))||0,
   kind, size, fillKg, active:true});
 }
 closeModal(); save(); render();
}

 ).join('') : '';
 const usedOrders=db.orders.filter(o=>o.items.some(it=>it.productId===id));

 }).join('') : `<div class="empty">ยังไม่มีออเดอร์ใช้สินค้านี้</div>`;

 const gasHistoryNote = isGas ? `<div class="empty">ถังไซส์นี้ไม่มีสต๊อกของตัวเอง (ตัดจากแก๊สดิบตรงๆ) — ดูประวัติการขาย/ยืมได้ที่บัตรสต๊อกของ${rawP?`<button class="lnk" style="padding:0" onclick="openProductDetail('${rawP.id}')">${esc(rawP.name)}</button>`:'แก๊สดิบ'}</div>` : '';
 showDetailPage(esc(p.name), p.sku?'รหัส '+esc(p.sku):'', `

   <div class="card stat" style="padding:12px 14px"><div class="lab">สถานะ</div><span class="chip c-${st}">${st}</span></div>
   <div class="card stat" style="padding:12px 14px"><div class="lab">ราคาขาย</div><b>${baht(p.price)}</b></div>

  ${kindLine}
  <div style="font-size:13.5px;font-weight:700;margin-bottom:8px">บัตรสต๊อก (ประวัติการเคลื่อนไหว)</div>
  ${isGas ? gasHistoryNote : (moveRows ? tbl(['วันที่','ประเภท',['จำนวน','num'],'โน้ต'], moveRows) : empty('ยังไม่มีการเคลื่อนไหว'))}
  <div style="font-size:13.5px;font-weight:700;margin:20px 0 8px">ออเดอร์ที่ใช้สินค้านี้</div>
  <div class="rowlist">${orderRows}</div>
 `, {wide:true, actions:
  ((p.kind==='บริการ'||isGas) ? '' : `<button class="btn sm" style="background:var(--ok)" onclick="openMove('${id}','รับเข้า')">+รับ</button><button class="btn ghost sm" onclick="openMove('${id}','เบิกออก')">−เบิก</button>`)+
  `<button class="btn ghost sm" onclick="openProductForm('${id}')">แก้</button>`
 });

/* ============ ก้อนที่ 2: เครื่องยนต์สต๊อก — addMove จุดเดียว ============ */
/* ⭐ ทุกการขยับสต๊อกต้องผ่าน addMove นี้จุดเดียว — ห้ามแก้ p.stock ที่อื่น */
function addMove(productId, type, qty, note, extra){
 const q=Number(qty);
 if(!(q>0)) return;
 const p=db.products.find(x=>x.id===productId);
 if(!p) return;
 if(type==='รับเข้า'||type==='ปรับเพิ่ม') p.stock += q;
 else if(type==='เบิกออก'||type==='ปรับลด') p.stock -= q;
 else return;
 db.moves.unshift(Object.assign({ id:uid(), date:todayStr(), productId, type, qty:q, note:note||'' }, extra||{}));
 save();
}

function openMove(productId, type){
 const p=db.products.find(x=>x.id===productId);
 if(!p) return;
 showFormPage(type==='รับเข้า'?'รับเข้า':'เบิกออก', esc(p.name), `
  <div class="fld"><label>จำนวน (${esc(p.unit)})</label><input id="mvQty" type="number" min="1" placeholder="0"></div>
  <div class="fld"><label>โน้ต (ไม่บังคับ)</label><input id="mvNote" placeholder="เช่น ล็อตใหม่ / ขายหน้าร้าน"></div>`, "saveMove", productId+'|'+type);
}

/* ⭐ ไม่มีขั้น "บรรจุแก๊ส" คั่นกลางอีกต่อไป — ขายน้ำแก๊สไซส์ไหนก็ตัดจากแก๊สดิบ (ถังเก็บใหญ่) ตรงๆ ทันทีตอนขาย/ยืม
   'คงเหลือ' ของสินค้า kind='น้ำแก๊ส' จึงไม่ใช่ค่าที่เก็บ (ไม่มีความหมายแล้ว) แต่คำนวณสดจากแก๊สดิบหารด้วย fillKg เสมอ
   raw ตัวแรกที่เจอ (kind='ดิบ') = แหล่งแก๊สดิบเดียวของระบบ */
function gasAvailable(p){
 if(!p || p.kind!=='น้ำแก๊ส') return p?p.stock:0;
 const raw=db.products.find(x=>x.kind==='ดิบ');
 if(!raw || !(Number(p.fillKg)>0)) return 0;
 return Math.floor((Number(raw.stock)||0)/Number(p.fillKg));
}

/* ⭐ กราฟวงกลมยอดแก๊สคงเหลือ (แดชบอร์ด) — คงเหลือ vs ขายไปแล้ว คำนวณจากแก๊สดิบล้วนๆ
   ขายไปแล้ว = ผลรวม "เบิกออก/ปรับลด" ทั้งหมดที่เคยเกิดกับแก๊สดิบ (นับของที่ตัดออกจริงเท่านั้น — ไม่พึ่งยอดรับเข้าตอนตั้งต้น
   ตอน seed เพราะสต๊อกเริ่มต้นไม่เคยถูกบันทึกเป็น move ถ้าเอา received-remaining จะได้ตัวเลขติดลบ/ผิดเพี้ยน) */
function gasChartInfo(){
 const raw=db.products.find(p=>p.kind==='ดิบ');
 if(!raw) return null;
 const used=db.moves.filter(m=>m.productId===raw.id && (m.type==='เบิกออก'||m.type==='ปรับลด')).reduce((s,m)=>s+(Number(m.qty)||0),0);
 const remaining=Math.max(0, Number(raw.stock)||0);
 return {raw, remaining, used, total:remaining+used};
}
function gasChartCard(){
 const info=gasChartInfo();
 if(!info) return '';
 const {raw, remaining, used, total}=info;
 const R=50, C=2*Math.PI*R;
 const remLen = total>0 ? C*(remaining/total) : 0;
 const usedLen = total>0 ? C*(used/total) : 0;
 const svg = total>0 ? `
   <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
   <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--accent)" stroke-width="16"
    stroke-dasharray="${usedLen} ${C-usedLen}" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
   <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--ok)" stroke-width="16"
    stroke-dasharray="${remLen} ${C-remLen}" stroke-dashoffset="${-usedLen}" transform="rotate(-90 60 60)"/>`
  : `<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>`;
 return `<div class="card" style="margin-bottom:18px;display:flex;gap:24px;align-items:center;flex-wrap:wrap">
   <svg viewBox="0 0 120 120" width="120" height="120" style="flex:none">${svg}</svg>
   <div style="flex:1;min-width:180px">
    <div style="font-size:13.5px;font-weight:700;margin-bottom:10px">ยอดแก๊สคงเหลือ (${esc(raw.name)})</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
     <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px"></span>คงเหลือ <b>${remaining.toLocaleString('th-TH')} kg</b></div>
     <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px"></span>ขายไปแล้ว <b>${used.toLocaleString('th-TH')} kg</b></div>
    </div>
   </div>
  </div>`;
}

function saveMove(key){
 let productId, type;
 if(key && String(key).includes('|')){
  [productId,type]=String(key).split('|');   // มาจากปุ่มลัด +รับ/−เบิก ในแท็บสินค้า
 }else{
  productId=val('mvProd'); type=val('mvType'); // มาจากฟอร์มในแท็บการเคลื่อนไหว
 }
 const qty=Number(val('mvQty'));
 if(!productId || !(qty>0)){ alert('กรอกสินค้าและจำนวนให้ครบ'); return; }
 addMove(productId, type, qty, val('mvNote'));
 closeModal(); render();
}

/* ============ v5 — A4: มูลค่าสต๊อก + ตรวจนับสต๊อก (ปรับผ่าน addMove จุดเดียวเท่านั้น) ============ */
function stockValueInfo(){
 let total=0, noCostCount=0;
 db.products.forEach(p=>{
  if(p.cost===undefined || p.cost===null || p.cost===''){ noCostCount++; return; }
  total += (Number(p.cost)||0)*(Number(p.stock)||0);
 });
 return {total, noCostCount};
}
function renderStockValueSection(){
 const sv=stockValueInfo();
 return `<h3 style="font-size:16px;margin:22px 0 10px">มูลค่าสต๊อก</h3>
  <div class="grid g2">
   <div class="card stat"><div class="lab">มูลค่าสต๊อกรวม (คงเหลือ×ต้นทุน)</div><b>${baht(sv.total)}</b></div>
   <div class="card stat"><div class="lab">สินค้าไม่มีต้นทุน (ไม่นับรวม)</div><b class="${sv.noCostCount?'money-neg':''}">${sv.noCostCount} รายการ</b></div>
  </div>`;
}
function openStocktake(){
 const countable=db.products.filter(p=>p.kind!=='บริการ');
 if(!countable.length){ alert('ยังไม่มีสินค้าให้ตรวจนับ'); return; }
 const rows=countable.map(p=>`<tr>
   <td>${esc(p.name)}</td>
   <td class="num">${p.stock} ${esc(p.unit)}</td>
   <td class="num"><input class="sel st-count" data-pid="${p.id}" type="number" min="0" style="width:150px;text-align:right" placeholder="เว้นว่าง=ไม่เปลี่ยน"></td>
  </tr>`).join('');
 showFormPage('ตรวจนับสต๊อก', 'กรอกจำนวนที่นับได้จริง — เว้นว่าง = ไม่ปรับรายการนั้น', tbl(['สินค้า',['คงเหลือระบบ','num'],['นับจริง','num']], rows),
  null, null, {wide:true, foot:`<div class="mfoot"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="savePress(this,'reviewStocktake')">ดูสรุปผลต่าง →</button></div>`});
}
function reviewStocktake(){
 const inputs=[...document.querySelectorAll('.st-count')];
 const diffs=[];
 inputs.forEach(inp=>{
  const v=String(inp.value||'').trim();
  if(v==='') return;
  const counted=Number(v);
  if(!(counted>=0)) return;
  const p=db.products.find(x=>x.id===inp.dataset.pid);
  if(!p) return;
  const diff=counted-(Number(p.stock)||0);
  if(diff!==0) diffs.push({productId:p.id, name:p.name, unit:p.unit, system:p.stock, counted, diff});
 });
 window.__stocktakeDiffs=diffs;
 if(!diffs.length){ alert('นับตรงกับระบบทุกรายการ — ไม่ต้องปรับอะไร'); closeModal(); return; }
 const rows=diffs.map(d=>{
  const cls=d.diff>0?'money-pos':'money-neg';
  return `<tr><td>${esc(d.name)}</td><td class="num">${d.system} ${esc(d.unit)}</td><td class="num">${d.counted} ${esc(d.unit)}</td><td class="num ${cls}">${d.diff>0?'+':''}${d.diff} ${esc(d.unit)}</td></tr>`;
 }).join('');
 showFormPage('สรุปผลต่างตรวจนับ', `พบ ${diffs.length} รายการไม่ตรง — ยืนยันเพื่อปรับสต๊อก`, tbl(['สินค้า',['คงเหลือระบบ','num'],['นับจริง','num'],['ผลต่าง','num']], rows),
  null, null, {wide:true, backFn:'openStocktake()', foot:`<div class="mfoot"><button class="btn ghost" onclick="openStocktake()">← กลับไปแก้</button><button class="btn" onclick="savePress(this,'confirmStocktake')">ยืนยันปรับสต๊อก</button></div>`});
}
function confirmStocktake(){
 const diffs=window.__stocktakeDiffs||[];
 if(!diffs.length){ closeModal(); return; }
 const note='ตรวจนับ '+thDate(todayStr());
 diffs.forEach(d=>{
  if(d.diff>0) addMove(d.productId, 'ปรับเพิ่ม', d.diff, note);
  else if(d.diff<0) addMove(d.productId, 'ปรับลด', -d.diff, note);
 });
 window.__stocktakeDiffs=null;
 closeModal();
}

/* ============ ก้อนที่ 3b: แท็บจัดซื้อ (ผู้ขาย + ใบสั่งซื้อ) ============
   ⭐ รับของ = ตอนนั้นค่อยตัด addMove('รับเข้า',...) — ไม่ใช่ตอนสร้าง/ส่ง PO (ของที่สั่งแล้วยังไม่มา ≠ สต๊อก)
   ⭐ จ่ายเงิน = addMoneyRow('ออก',...,{unpaid:true,refType:'po',refId}) ยอดตามที่ "รับจริง" เท่านั้น → โผล่เป็นเจ้าหนี้ทันที
   ⭐ PO ห้ามลบ — ยกเลิกได้เฉพาะร่าง/สั่งแล้ว (cancelPo) ไม่แตะสต๊อก/เงิน · แก้ไขได้เฉพาะร่าง */
registerModule({key:'purchases', ic:'truck', label:'จัดซื้อ', render:renderPurchases});

let purchasesTab='po';   // สลับแท็บย่อย 'po' | 'vendor' — เป็น view state เฉย ๆ ไม่เก็บลง db
function setPurchasesTab(t){ purchasesTab=t; render(); }

function nextPoNumber(){
 const y=thYear();
 if(!db.docCounters['PO']) db.docCounters['PO']={};
 const n=(db.docCounters['PO'][y]||0)+1;
 db.docCounters['PO'][y]=n;
 save();
 return `PO-${y}-${pad3(n)}`;
}

/* เจ้าหนี้ต่อผู้ขาย — รวมเฉพาะบิลที่เกิดจาก PO ของผู้ขายรายนั้นและยังไม่จ่าย */
function vendorApBalance(vendorId){
 const poIds=new Set(db.pos.filter(p=>p.vendorId===vendorId).map(p=>p.id));
 return db.money.filter(m=>m.unpaid && m.refType==='po' && poIds.has(m.refId)).reduce((s,m)=>s+(Number(m.amount)||0),0);
}

function renderPurchases(){
 let html=`<div class="pagehead"><div><h2>จัดซื้อ</h2><div class="sub">สั่งของเข้าร้าน ตามยอดที่รับจริง</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   ${purchasesTab==='po'?`<button class="btn ghost" onclick="openQuickGasReceive()">รับแก๊สดิบด่วน (ไม่ผ่าน PO)</button><button class="btn" onclick="openPoForm()">+ สั่งซื้อ</button>`:`<button class="btn" onclick="openVendorForm()">+ เพิ่มผู้ขาย</button>`}
  </div></div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
   <button class="btn ${purchasesTab==='po'?'':'ghost'} sm" onclick="setPurchasesTab('po')">ใบสั่งซื้อ</button>
   <button class="btn ${purchasesTab==='vendor'?'':'ghost'} sm" onclick="setPurchasesTab('vendor')">ผู้ขาย</button>
  </div>`;
 return html + (purchasesTab==='po' ? renderPoList() : renderVendorList());
}

function renderPoList(){
 if(!db.pos.length) return empty('ยังไม่มีใบสั่งซื้อ กดปุ่ม + สั่งซื้อ');
 const rows=db.pos.slice().reverse().map(po=>{
  const v=db.vendors.find(x=>x.id===po.vendorId);
  const total=po.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
  return `<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openPoDetail('${po.id}')">${esc(po.number)}</button></td>
   <td>${thDate(po.date)}</td>
   <td>${v?esc(v.name):'—'}</td>
   <td>${po.items.length} รายการ</td>
   <td class="num">${baht(total)}</td>
   <td><span class="chip c-${esc(po.status)}">${esc(po.status)}</span></td>
   <td class="act"><button class="lnk" onclick="openPoDetail('${po.id}')">ดู</button></td>
  </tr>`;
 }).join('');
 return tbl(['เลขที่','วันที่','ผู้ขาย','รายการ',['ยอดสั่ง','num'],'สถานะ',['','act']], rows);
}

function renderVendorList(){
 if(!db.vendors.length) return empty('ยังไม่มีผู้ขาย กดปุ่ม + เพิ่มผู้ขาย');
 const rows=db.vendors.map(v=>{
  const ap=vendorApBalance(v.id);
  const hasPos=db.pos.some(p=>p.vendorId===v.id);
  const delBtn = hasPos
   ? `<button class="lnk" style="opacity:.4;cursor:default" title="มีประวัติสั่งซื้ออยู่ ลบไม่ได้">ลบ</button>`
   : `<button class="lnk del" onclick="delRow('vendors','${v.id}')">ลบ</button>`;
  return `<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openVendorDetail('${v.id}')">${esc(v.name)}</button></td>
   <td>${v.phone?esc(v.phone):'—'}</td>
   <td class="num ${ap>0?'money-neg':''}">${baht(ap)}</td>
   <td class="act">
    <button class="lnk" onclick="openVendorForm('${v.id}')">แก้</button>
    ${delBtn}
   </td>
  </tr>`;
 }).join('');
 return tbl(['ชื่อผู้ขาย','เบอร์โทร',['ค้างจ่าย','num'],['','act']], rows);
}

function saveVendor(id){

 showDetailPage(esc(v.name), v.phone?esc(v.phone):'', `

/* ============ ใบสั่งซื้อ (PO) ============
   items[].productId = null ได้ ("ไม่ระบุสินค้า") — พิมพ์ชื่อเองก็สั่งได้ แต่รับของแล้วไม่ตัด/ไม่เพิ่มสต๊อก
   ราคา/หน่วย ใส่เป็นราคาต่อหน่วยของสินค้านั้น (เช่น แก๊สดิบหน่วย kg → นี่คือราคาต่อกิโล) ยอดรวมคำนวณสดจากจำนวน×ราคา */
function poItemRow(productId, name, qty, price){
 // น้ำแก๊ส (kind='น้ำแก๊ส') ไม่มีสต๊อกของตัวเอง ซื้อเข้าตรงๆ ไม่ได้ — ต้องซื้อ "แก๊สดิบ" แทน (ถังใหญ่จะไปหารเป็นน้ำแก๊สแต่ละไซส์ให้เองตอนขาย)
 const opts=db.products.filter(p=>p.kind!=='น้ำแก๊ส' && (p.active!==false || p.id===productId)).map(p=>`<option value="${p.id}" data-cost="${Number(p.cost)||0}" ${p.id===productId?'selected':''}>${esc(p.name)} (${esc(p.unit)})</option>`).join('');
 return `<div class="frow pi-row" style="align-items:flex-end;margin-bottom:8px">
   <div class="fld" style="flex:2;margin-bottom:0"><select class="pi-prod" onchange="onPoItemProductChange(this)"><option value="">— ไม่ระบุสินค้า (พิมพ์ชื่อเอง) —</option>${opts}</select>
    <input class="pi-name" placeholder="ชื่อรายการ (ถ้าไม่ระบุสินค้า)" value="${name?esc(name):''}" style="margin-top:6px;${productId?'display:none':''}">
   </div>
   <div class="fld" style="flex:1;margin-bottom:0"><input class="pi-qty" type="number" min="0" step="any" placeholder="จำนวน" value="${qty>0?qty:''}" oninput="recalcPoTotal()"></div>
   <div class="fld" style="flex:1;margin-bottom:0"><input class="pi-price" type="number" min="0" step="any" placeholder="ราคา/หน่วย" value="${price>0?price:''}" oninput="recalcPoTotal()"></div>
   <button class="lnk del" type="button" onclick="this.closest('.pi-row').remove(); recalcPoTotal()" style="padding:10px 8px;font-size:15px">✕</button>
  </div>`;
}
function onPoItemProductChange(sel){
 const row=sel.closest('.pi-row');
 const nameInput=row.querySelector('.pi-name');
 const priceInput=row.querySelector('.pi-price');
 const opt=sel.selectedOptions[0];
 if(sel.value){
  nameInput.style.display='none';
  if(!priceInput.value && opt && opt.dataset.cost && Number(opt.dataset.cost)>0) priceInput.value=opt.dataset.cost;
 }else{
  nameInput.style.display='';
 }
 recalcPoTotal();
}
function addPoItemRow(){
 const box=document.getElementById('po_items');
 if(box) box.insertAdjacentHTML('beforeend', poItemRow('', '', 0, 0));
}
function recalcPoTotal(){
 const rows=[...document.querySelectorAll('#po_items .pi-row')];
 let total=0;
 rows.forEach(row=>{
  const qty=Number(row.querySelector('.pi-qty')?.value||0);
  const price=Number(row.querySelector('.pi-price')?.value||0);
  total += qty*price;
 });
 const box=document.getElementById('po_total');
 if(box) box.textContent=baht(total);
}

function openPoForm(id, vendorId, prefillItems){
 const po=id?db.pos.find(x=>x.id===id):null;
 if(po && po.status!=='ร่าง'){ alert('แก้ไขได้เฉพาะใบที่ยังเป็นร่างเท่านั้น'); return; }
 const vid = po ? po.vendorId : (vendorId||'');
 const vendorOpts=db.vendors.length
  ? db.vendors.map(v=>`<option value="${v.id}" ${vid===v.id?'selected':''}>${esc(v.name)}</option>`).join('')
  : `<option value="">— ยังไม่มีผู้ขาย ไปเพิ่มในแท็บผู้ขายก่อน —</option>`;
 const srcItems = po ? po.items : (prefillItems && prefillItems.length ? prefillItems : null);
 const itemsHtml = srcItems && srcItems.length
  ? srcItems.map(it=>poItemRow(it.productId, it.name, it.qty, it.price)).join('')
  : poItemRow('', '', 0, 0);
 showFormPage(po?'แก้ไขใบสั่งซื้อ':'สั่งซื้อใหม่', '', `
  <div class="fld"><label>ผู้ขาย</label><select id="po_vendor">${vendorOpts}</select></div>
  <div class="fld"><label>รายการสั่งซื้อ</label><div id="po_items">${itemsHtml}</div>
   <button class="btn ghost sm" type="button" onclick="addPoItemRow()" style="margin-top:2px">+ เพิ่มรายการ</button></div>
  <div class="fld"><label>โน้ต</label><input id="po_note" value="${po?esc(po.note||''):''}" placeholder="ไม่บังคับ"></div>
  <div style="text-align:right;font-size:15px;font-weight:700;margin-top:6px">ยอดรวม: <span id="po_total">฿0</span></div>`,
  'savePo', id, {wide:true});
 recalcPoTotal();
}

function savePo(id){
 const vendorId=val('po_vendor');
 if(!vendorId){ alert('เลือกผู้ขายก่อน'); return; }
 const rows=[...document.querySelectorAll('#po_items .pi-row')];
 const items=[];
 rows.forEach(row=>{
  const prodSel=row.querySelector('.pi-prod');
  const nameInput=row.querySelector('.pi-name');
  const qty=Number(row.querySelector('.pi-qty')?.value||0);
  const price=Number(row.querySelector('.pi-price')?.value||0);
  const productId=prodSel && prodSel.value ? prodSel.value : null;
  const p=productId?db.products.find(x=>x.id===productId):null;
  const name = p ? p.name : (nameInput?nameInput.value.trim():'');
  if(!(qty>0) || !name) return;
  items.push({productId, name, qty, price});
 });
 if(!items.length){ alert('ใส่รายการสั่งซื้ออย่างน้อย 1 รายการ (ต้องมีชื่อสินค้าและจำนวน)'); return; }
 const note=val('po_note');
 if(id){
  const po=db.pos.find(x=>x.id===id);
  if(po){ po.vendorId=vendorId; po.items=items; po.note=note; }
 }else{
  db.pos.unshift({id:uid(), number:nextPoNumber(), vendorId, date:todayStr(), items, status:'ร่าง', receivedAt:null, note});
 }
 save(); closeModal(); render();
}

function sendPo(id){
 const po=db.pos.find(x=>x.id===id);
 if(!po || po.status!=='ร่าง') return;
 po.status='สั่งแล้ว'; save(); render();
}

function cancelPo(id){
 const po=db.pos.find(x=>x.id===id);
 if(!po || (po.status!=='ร่าง' && po.status!=='สั่งแล้ว')) return;
 if(!confirm('ยกเลิกใบสั่งซื้อนี้?')) return;
 po.status='ยกเลิก'; save(); render();
}

/* ⭐ รับของ — ปรับจำนวนรับจริงต่อบรรทัดได้ (ของมาไม่ครบก็ปิด PO ได้) ตัดสต๊อก+ลงบัญชีเฉพาะยอดรับจริงเท่านั้น */
function openPoReceive(id){
 const po=db.pos.find(x=>x.id===id);
 if(!po || po.status!=='สั่งแล้ว') return;
 const rows=po.items.map((it,i)=>`<tr>
   <td>${esc(it.name)}</td>
   <td class="num">${esc(it.qty)}</td>
   <td class="num"><input class="pr-qty" data-i="${i}" type="number" min="0" step="any" style="width:120px;text-align:right" value="${it.qty}"></td>
  </tr>`).join('');
 showFormPage('รับของ', esc(po.number), tbl(['รายการ',['สั่ง','num'],['รับจริง','num']], rows),
  null, null, {wide:true, foot:`<div class="mfoot"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="savePress(this,'confirmPoReceive','${id}')">ยืนยันรับของ</button></div>`});
}
function confirmPoReceive(id){
 const po=db.pos.find(x=>x.id===id);
 if(!po || po.status!=='สั่งแล้ว') return;   // กันรับซ้ำ
 const inputs=[...document.querySelectorAll('.pr-qty')];
 const vendor=db.vendors.find(x=>x.id===po.vendorId);
 let total=0;
 inputs.forEach(inp=>{
  const i=Number(inp.dataset.i);
  const it=po.items[i];
  const recvQty=Number(inp.value)||0;
  it.received=recvQty;
  if(recvQty<=0) return;
  total += recvQty*(Number(it.price)||0);
  if(it.productId) addMove(it.productId, 'รับเข้า', recvQty, 'รับของ '+po.number, {refType:'po', refId:po.id});
 });
 if(total>0){
  addMoneyRow('ออก', total, 'รับของ PO '+po.number, {unpaid:true, refType:'po', refId:po.id, category:'วัตถุดิบ', payeeName:vendor?vendor.name:'', payeeTaxId:vendor?vendor.taxId:''});
 }
 po.status='รับแล้ว'; po.receivedAt=todayStr();
 closeModal(); render();
}

function openPoDetail(id){
 const po=db.pos.find(x=>x.id===id);
 if(!po) return;
 const v=db.vendors.find(x=>x.id===po.vendorId);
 const total=po.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
 const itemRows=po.items.map(it=>`<tr>
   <td>${it.productId?`<button class="lnk" style="padding:0;color:var(--ink)" onclick="openProductDetail('${it.productId}')">${esc(it.name)}</button>`:esc(it.name)}</td>
   <td class="num">${esc(it.qty)}</td>
   <td class="num">${baht(it.price)}</td>
   <td class="num">${baht((Number(it.qty)||0)*(Number(it.price)||0))}</td>
   <td class="num">${it.received!==undefined?esc(it.received):'—'}</td>
  </tr>`).join('');
 const bill=db.money.find(m=>m.refType==='po' && m.refId===po.id);
 let billLine='';
 if(bill){
  billLine=`<div style="font-size:13.5px;margin:14px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
   บิลค่าซื้อ ${baht(bill.amount)} — ${bill.unpaid?'<span class="chip c-ใหม่">ยังไม่จ่าย</span>':'<span class="chip c-เสร็จ">จ่ายแล้ว</span>'}
   ${bill.unpaid?`<button class="lnk" onclick="markBillPaid('${bill.id}'); openPoDetail('${id}')">ทำเครื่องหมายว่าจ่ายแล้ว</button>`:''}
  </div>`;
 }
 let actions='';
 if(po.status==='ร่าง') actions=`<button class="btn sm" onclick="sendPo('${id}'); openPoDetail('${id}')">สั่งซื้อ</button>`+
  `<button class="btn ghost sm" onclick="openPoForm('${id}')">แก้ไข</button>`+
  `<button class="btn ghost sm" style="color:var(--danger)" onclick="cancelPo('${id}'); openPoDetail('${id}')">ยกเลิก</button>`;
 else if(po.status==='สั่งแล้ว') actions=`<button class="btn sm" style="background:var(--ok)" onclick="openPoReceive('${id}')">รับของ</button>`+
  `<button class="btn ghost sm" style="color:var(--danger)" onclick="cancelPo('${id}'); openPoDetail('${id}')">ยกเลิก</button>`;

 showDetailPage(esc(po.number), v?esc(v.name):'—', `
  <div class="grid g3" style="margin-bottom:18px">
   <div class="card stat" style="padding:12px 14px"><div class="lab">สถานะ</div><span class="chip c-${esc(po.status)}">${esc(po.status)}</span></div>
   <div class="card stat" style="padding:12px 14px"><div class="lab">ยอดสั่ง</div><b>${baht(total)}</b></div>
   <div class="card stat" style="padding:12px 14px"><div class="lab">วันที่</div><b style="font-size:15px">${thDate(po.date)}</b></div>
  </div>
  ${billLine}
  ${tbl(['รายการ',['จำนวน','num'],['ราคา/หน่วย','num'],['รวม','num'],['รับจริง','num']], itemRows)}
  ${po.note?`<div style="font-size:13.5px;color:var(--muted);margin-top:14px">โน้ต: ${esc(po.note)}</div>`:''}
 `, {wide:true, actions});
}

/* ⭐ ปุ่มลัดจากการ์ด "ของใกล้หมด" — prefill qty ให้พอกลับไป 2 เท่าของ lowAt, price = cost ปัจจุบัน */
function createPoFromLowStock(){
 const low=db.products.filter(p=>p.kind!=='บริการ' && p.kind!=='ชำรุด' && p.kind!=='เปล่า' && p.kind!=='ใหม่' && p.active!==false && p.stock<=p.lowAt);
 if(!low.length){ alert('ตอนนี้ไม่มีสินค้าใกล้หมด'); return; }
 const items=low.map(p=>({productId:p.id, name:p.name, qty:Math.max(1, p.lowAt*2-p.stock), price:Number(p.cost)||0}));
 openPoForm('', '', items);
}

/* ⭐ รับแก๊สดิบด่วน — ทางลัดสำหรับซื้อสดหน้างาน ไม่ผ่านผู้ขาย/PO
   กรอกน้ำหนักที่รับ+ราคาแก๊สต่อกิโลตรงๆ ระบบคูณยอดรวมให้เอง แล้วตัดเข้าสต๊อกแก๊สดิบ + ลงบัญชีจ่ายทันที (ไม่ใช่ค้างจ่ายแบบ PO)
   ⭐ ราคา/กก. จำค่าล่าสุดไว้ที่ raw.cost (เดิมเป็นต้นทุน/หน่วยของสินค้าอยู่แล้ว) — เปิดฟอร์มมาเติมให้อัตโนมัติ ไม่ต้องพิมพ์ซ้ำทุกรอบถ้าราคาไม่เปลี่ยน แก้ในช่องได้ตามปกติเมื่อราคาขยับ */
function openQuickGasReceive(){
 const raw=db.products.find(p=>p.kind==='ดิบ');
 if(!raw){ alert('ยังไม่มีสินค้าประเภท "แก๊สดิบ" ในระบบ — ไปเพิ่มในแท็บสินค้าก่อน'); return; }
 const lastPrice=Number(raw.cost)||0;
 showFormPage('รับแก๊สดิบด่วน', esc(raw.name)+' — ไม่ผ่านผู้ขาย/PO เหมาะกับซื้อสดหน้างาน', `
  <div class="frow">
   <div class="fld"><label>น้ำหนักที่รับ (kg)</label><input id="qg_kg" type="number" min="0" step="any" placeholder="0" oninput="recalcQuickGas()"></div>
   <div class="fld"><label>ราคาแก๊ส (บาท/kg)</label><input id="qg_price" type="number" min="0" step="any" value="${lastPrice>0?lastPrice:''}" oninput="recalcQuickGas()"></div>
  </div>
  <div style="font-size:12.5px;color:var(--muted);margin:-8px 0 12px">จำราคาล่าสุดไว้ให้แล้ว — ราคาไม่เปลี่ยนไม่ต้องแก้ ถ้าเปลี่ยนแก้เลขในช่องได้ตามปกติ</div>
  <div class="fld"><label>โน้ต (ไม่บังคับ)</label><input id="qg_note" placeholder="เช่น ซื้อจากรถส่งแก๊ส"></div>
  <div style="font-size:13.5px;color:var(--muted)">ยอดรวม <span id="qg_avg">฿0</span></div>`,
  null, null, {foot:`<div class="mfoot"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="savePress(this,'saveQuickGasReceive')">บันทึก</button></div>`});
 recalcQuickGas();
}
function recalcQuickGas(){
 const kg=Number(val('qg_kg'))||0, price=Number(val('qg_price'))||0;
 const box=document.getElementById('qg_avg');
 if(box) box.textContent=baht(kg*price);
}
/* ⭐ รับแก๊สดิบด่วนก็สร้างใบสั่งซื้อ (po) ให้อัตโนมัติ (สถานะ 'รับแล้ว' เลย ไม่มีผู้ขายผูกไว้)
   เพื่อให้ไปโผล่ในแท็บ "จัดซื้อ" ด้วย — จะได้มีที่เดียวสำหรับดูประวัติจัดซื้อทั้งหมด ไม่ว่าจะผ่าน PO เต็มรูปหรือซื้อสดหน้างาน */
function saveQuickGasReceive(){
 const raw=db.products.find(p=>p.kind==='ดิบ');
 if(!raw) return;
 const kg=Number(val('qg_kg'));
 const price=Number(val('qg_price'));
 if(!(kg>0)){ alert('กรอกน้ำหนักที่รับให้ถูกต้อง'); return; }
 const note=val('qg_note')||'รับแก๊สดิบด่วน';
 const refId=uid();
 addMove(raw.id, 'รับเข้า', kg, note, {refType:'po', refId});
 const amt=kg*price;
 if(amt>0) addMoneyRow('ออก', amt, note+' ('+kg+' kg x '+baht(price)+'/kg)', {category:'วัตถุดิบ', refType:'po', refId});
 if(price>0) raw.cost=price;   // จำราคาล่าสุดไว้ใช้ครั้งถัดไป
 db.pos.unshift({id:refId, number:nextPoNumber(), vendorId:null, date:todayStr(), items:[{productId:raw.id, name:raw.name, qty:kg, price, received:kg}], status:'รับแล้ว', receivedAt:todayStr(), note:note+' (ซื้อสดหน้างาน ไม่ผ่านผู้ขาย)'});
 closeModal(); render();
}

/* ============ ก้อนที่ 4: แท็บลูกค้า (ทะเบียนลูกค้า) ============ */
/* เดโม่ลูกค้าของ BizSuite เดิมถูกล้างออกแล้ว (โจทย์ธุรกิจแก๊สล้วน) — เพิ่มลูกค้าจริงเองที่แท็บนี้ */
(function seedCustomers(){
 if(db.demoCleared) return;
 if(db.customers.length) return;
})();

registerModule({key:'customers', ic:'customers', label:'ลูกค้า', render:renderCustomers});

function renderCustomers(){
 let html=`<div class="pagehead"><div><h2>ลูกค้า</h2><div class="sub">ฐานลูกค้าของร้าน — คลิกชื่อดูรายละเอียด</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn ghost" onclick="importCustomersFromFile()">นำเข้าจากไฟล์</button>
   <input id="importCustFile" type="file" accept=".json" style="display:none" onchange="onImportCustomersFile(event)">
   <button class="btn" onclick="openCustomer()">+ เพิ่ม</button>
  </div></div>`;
 if(!db.customers.length) return html+empty('ยังไม่มีลูกค้า กดปุ่ม + เพิ่ม ด้านบน');
 const rows=db.customers.map(c=>{
  return `<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openCustomerDetail('${c.id}')">${esc(c.name)}</button></td>
   <td>${c.phone?esc(c.phone):'—'}</td>
   <td><span class="chip ${c.personType==='นิติบุคคล'?'c-ใหม่':'c-เสร็จ'}">${esc(c.personType||'บุคคล')}</span></td>
   <td>${c.note?esc(c.note):'—'}</td>
   <td class="act">
    <button class="lnk" onclick="openCustomer('${c.id}')">แก้</button>
    <button class="lnk del" onclick="delRow('customers','${c.id}')">ลบ</button>
   </td>
  </tr>`;
 }).join('');
 return html+tbl(['ชื่อ','เบอร์โทร','ประเภท','โน้ต',['จัดการ','act']], rows);
}

function openCustomer(id, opts){
 opts=opts||{};
 const c=id?db.customers.find(x=>x.id===id):null;
 const isEntity = c && c.personType==='นิติบุคคล';
 showFormPage(c?"แก้ลูกค้า":"เพิ่มลูกค้า", "", `
  <div class="fld"><label>ชื่อ</label><input id="cName" value="${c?esc(c.name):""}" placeholder="เช่น คุณสมหญิง / บจก.ตัวอย่าง"></div>
  <div class="frow">
   <div class="fld"><label>เบอร์โทร</label><input id="cPhone" value="${c?esc(c.phone):""}" placeholder="เช่น 081-234-5678"></div>
   <div class="fld"><label>ประเภทบุคคล <span style="color:var(--faint);font-weight:400">(หัก ณ ที่จ่ายได้เฉพาะนิติบุคคล)</span></label><select id="cPersonType">
    <option value="บุคคล" ${!isEntity?'selected':''}>บุคคลธรรมดา</option>
    <option value="นิติบุคคล" ${isEntity?'selected':''}>นิติบุคคล</option>
   </select></div>
  </div>

/* ⭐ นำเข้าลูกค้าจากไฟล์ JSON — เติมเข้า db.customers (ไม่ทับของเดิมเหมือนปุ่ม "นำเข้าข้อมูล" หลัก)
   ไฟล์ต้องเป็น array ของ {name, phone, note, personType, taxId, address} — ชื่อซ้ำกับที่มีอยู่แล้ว (ตัดช่องว่าง ไม่สนตัวพิมพ์) จะข้ามไป กันนำเข้าซ้ำถ้ากดสองครั้ง */
function importCustomersFromFile(){
 document.getElementById('importCustFile').click();
}
function onImportCustomersFile(ev){
 const file=ev.target.files && ev.target.files[0];
 if(!file) return;
 const reader=new FileReader();
 reader.onload=function(){
  let list;
  try{ list=JSON.parse(reader.result); }
  catch(e){ alert('ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON'); ev.target.value=''; return; }
  if(!Array.isArray(list)){ alert('ไฟล์ต้องเป็นลิสต์ลูกค้า (JSON array)'); ev.target.value=''; return; }
  const existingNames=new Set(db.customers.map(c=>String(c.name||'').trim().toLowerCase()));
  let added=0, skipped=0;
  list.forEach(row=>{
   const name=String(row.name||'').trim();
   if(!name){ skipped++; return; }
   if(existingNames.has(name.toLowerCase())){ skipped++; return; }
   db.customers.push({id:uid(), name, phone:row.phone||'', note:row.note||'', personType:row.personType==='นิติบุคคล'?'นิติบุคคล':'บุคคล', taxId:row.taxId||'', address:row.address||''});
   existingNames.add(name.toLowerCase());
   added++;
  });
  save(); render();
  alert('นำเข้าลูกค้าสำเร็จ '+added+' ราย'+(skipped?' (ข้าม '+skipped+' ราย เพราะชื่อซ้ำหรือไม่มีชื่อ)':''));
  ev.target.value='';
 };
 reader.readAsText(file);
}

/* ============ หน้ารายละเอียดลูกค้า — ยอดค้างชำระ + ประวัติออเดอร์/เอกสาร (คลิกไล่ต่อได้) ============ */
function custDebt(id){
 return db.docs.filter(d=>d.customerId===id && d.type==='ใบแจ้งหนี้' && d.status==='ส่งแล้ว')
  .reduce((s,d)=>s+(Number(d.amount)||0), 0);
}

/* ============ ระบบยืม/คืน/ฝากถังรายลูกค้า (db.custody) ============
   ⭐ ยืม = ลูกค้าจ่ายเงินค่าแก๊สทันทีเหมือนแลกถัง แต่ยังไม่มีถังเปล่ามาคืน → ตัดสต๊อก "น้ำแก๊ส" + คิดเงิน + บันทึกยอดค้างคืนถังเปล่า
   ⭐ คืน = ลูกค้าเอาถังเปล่าที่ค้างมาคืน → รับเข้าสต๊อก "เปล่า" + ตัดยอดค้าง (ไม่คิดเงินซ้ำ จ่ายไปตอนยืมแล้ว)
   ⭐ ฝาก = ถังของลูกค้าเอง ฝากไว้ที่ร้าน → ไม่กระทบสต๊อก/เงินร้านเลย แค่บันทึกว่าร้านถือถังใครไว้กี่ใบ · ถอนฝาก = ตัดยอดฝากคืน
   ⭐ เปลี่ยนถังชำรุด = ลูกค้าเอาถังเปล่าที่ชำรุดมาเปลี่ยนเป็นถังใหม่ทั้งลูก → ตัดสต๊อก "ใหม่" + คิดราคาถังใหม่ (ถังชำรุดไม่นับเข้าสต๊อกเปล่า เพราะใช้ต่อไม่ได้) */
function custodyBalance(customerId, size){
 let borrowed=0, deposited=0;
 db.custody.filter(c=>c.customerId===customerId && c.size===size).forEach(c=>{
  if(c.type==='ยืม') borrowed+=c.qty;
  else if(c.type==='คืน') borrowed-=c.qty;
  else if(c.type==='ฝาก') deposited+=c.qty;
  else if(c.type==='ถอนฝาก') deposited-=c.qty;
 });
 return {borrowed, deposited};
}
function custodySizes(customerId){
 const sizes=[...new Set(db.custody.filter(c=>c.customerId===customerId).map(c=>c.size))];
 return sizes.map(size=>({size, ...custodyBalance(customerId,size)}));
}
function cylinderSizeOptions(kind, selected){
 const sizes=[...new Set(db.products.filter(p=>p.kind===kind && p.size).map(p=>p.size))];
 if(!sizes.length) return `<option value="">— ไม่มีถังประเภทนี้ในระบบ —</option>`;
 return sizes.map(s=>`<option value="${esc(s)}" ${selected===s?'selected':''}>${esc(s)}</option>`).join('');
}

/* ============ ก้อนที่ 5: แท็บออเดอร์/ขาย — ปิดออเดอร์แล้วตัดสต๊อกผ่าน addMove จุดเดียว ============ */
registerModule({key:"orders", ic:"orders", label:"ออเดอร์", render:renderOrders});

function orderTotal(o){
 return o.items.reduce((s,it)=>{ const p=db.products.find(x=>x.id===it.productId); return s + (p?Number(p.price)||0:0)*Number(it.qty||0); }, 0);
}

/* ============ ก้อนที่ 7: กำไรต่อออเดอร์ — คำนวณสดจาก ราคาขาย−ต้นทุน ไม่เก็บลง db ============ */
function orderProfit(o){
 return o.items.reduce((s,it)=>{
  const p=db.products.find(x=>x.id===it.productId);
  if(!p) return s;   // ไม่เจอสินค้า → ข้ามบรรทัดนั้น
  return s + ((Number(p.price)||0)-(Number(p.cost)||0))*Number(it.qty||0);
 }, 0);
}

 // ⭐ ไม่โชว์ตัวเลขคงเหลือต่อท้ายชื่อแล้ว (เอาไปดูภาพรวมที่กราฟแดชบอร์ดแทน) — ให้เลือกเร็ว ไม่ต้องอ่านตัวเลขรก

function saveOrder(id){
 const customerId=val("o_cust");
 const assigneeId=val('o_assignee')||null;
 const paymentMethod=val('o_payment')||'สด';
 const rows=[...document.querySelectorAll("#o_items .oi-row")];
 const items=[];
 rows.forEach(row=>{
  const sel=row.querySelector('.oi-prod');
  const qtyEl=row.querySelector('.oi-qty');
  const pid=sel?sel.value:'';
  const qty=Number(qtyEl?qtyEl.value:0);
  if(!pid || !(qty>0)) return;
  items.push({productId:pid, qty});
 });
 if(!items.length){ alert("ใส่รายการสินค้าอย่างน้อย 1 รายการ"); return; }
 if(id){
  const o=db.orders.find(x=>x.id===id);
  if(o){ o.customerId=customerId; o.items=items; o.assigneeId=assigneeId; o.paymentMethod=paymentMethod; }   // ห้ามแตะ stockDeducted/status
 }else{
  db.orders.unshift({id:uid(), customerId, date:todayStr(), status:"ใหม่", items, stockDeducted:false, assigneeId, paymentMethod, workStage:'ใหม่'});
 }
 save(); closeModal(); render();
}

/* ⭐ หัวใจก้อนนี้: ปิดออเดอร์ = ตัดสต๊อกผ่าน addMove จุดเดียว
   น้ำแก๊ส → ไม่มีสต๊อกของตัวเอง แปลงเป็นกิโลแล้วตัดจากแก๊สดิบ (ถังเก็บใหญ่) ตรงๆ · ถังใหม่ → ตัดสต๊อกก้อนของตัวเอง
   บริการ (kind='บริการ') → ไม่ตัดสต๊อกเลย · เช็ครวมกิโลแก๊สที่ต้องใช้ทั้งออเดอร์ก่อนตัดจริง กันกรณีมีหลายไซส์ในออเดอร์เดียวรวมกันเกินที่มี */
function completeOrder(id){
 const o=db.orders.find(x=>x.id===id);
 if(!o || o.stockDeducted) return;   // กันตัดซ้ำ
 const raw=db.products.find(x=>x.kind==='ดิบ');
 let rawKgNeeded=0;
 for(const it of o.items){
  const p=db.products.find(x=>x.id===it.productId);
  if(p && p.kind==='น้ำแก๊ส'){ rawKgNeeded += Number(it.qty)*(Number(p.fillKg)||0); continue; }
  if(p && p.kind!=='บริการ' && Number(it.qty)>p.stock){ alert("ของไม่พอ: "+p.name+" เหลือ "+p.stock); return; }
 }
 if(rawKgNeeded>0){
  if(!raw){ alert('ไม่พบสินค้าแก๊สดิบในระบบ'); return; }
  if(raw.stock<rawKgNeeded){ alert('แก๊สดิบไม่พอ: ต้องใช้ '+rawKgNeeded+' kg เหลือ '+raw.stock+' kg'); return; }
 }
 o.items.forEach(it=>{
  const p=db.products.find(x=>x.id===it.productId);
  if(p && p.kind==='บริการ') return;   // บริการไม่ตัดสต๊อก
  if(p && p.kind==='น้ำแก๊ส'){
   const kgNeed=Number(it.qty)*(Number(p.fillKg)||0);
   addMove(raw.id, "เบิกออก", kgNeed, "ขายแก๊ส "+(p.size||p.name)+" x"+it.qty, {refType:'order', refId:o.id});
   return;
  }
  addMove(it.productId, "เบิกออก", it.qty, "ขาย/ออเดอร์", {refType:'order', refId:o.id});
 });
 o.stockDeducted=true; o.status="เสร็จ"; o.workStage="ปิด";
 save(); render();
}

/* ⭐ ไทม์ไลน์แสดงผลของออเดอร์ (ใหม่→กำลังทำ→ส่งแล้ว→ปิด) — เป็น field แยกต่างหากจาก status/stockDeducted
   (status/stockDeducted ยังคุมตัดสต๊อกเหมือนเดิมทุกตัวอักษร ไม่แตะ) ใช้แค่ให้เจ้าของไล่ดูความคืบหน้างานเฉย ๆ
   ไหลทางเดียวเท่านั้น (เหมือนสถานะเอกสาร) — ปิดออเดอร์ (completeOrder) จะบังคับเป็น 'ปิด' เสมอ */
const ORDER_STAGES=['ใหม่','กำลังทำ','ส่งแล้ว','ปิด'];
function advanceOrderStage(id){
 const o=db.orders.find(x=>x.id===id);
 if(!o) return;
 const i=ORDER_STAGES.indexOf(o.workStage||'ใหม่');
 if(i<0 || i>=ORDER_STAGES.length-1) return;
 o.workStage=ORDER_STAGES[i+1];
 save(); openOrderDetail(id);
}
function setOrderAssignee(id){
 const o=db.orders.find(x=>x.id===id);
 if(!o) return;
 o.assigneeId=val('od_assignee')||null;
 save(); openOrderDetail(id);
}
function setOrderPayment(id){
 const o=db.orders.find(x=>x.id===id);
 if(!o) return;
 o.paymentMethod=val('od_payment')||'สด';
 save(); openOrderDetail(id);
}
function staffName(id){ const s=db.staff.find(x=>x.id===id); return s?s.name:''; }

/* ============ หน้ารายละเอียดออเดอร์ — ไทม์ไลน์สถานะ + ผู้รับผิดชอบ + โซ่เอกสาร + ปุ่มขั้นถัดไป ============ */
function openOrderDetail(id){
 const o=db.orders.find(x=>x.id===id);
 if(!o) return;
 const c=db.customers.find(x=>x.id===o.customerId);
 const stage=o.workStage||'ใหม่';
 const stageIdx=Math.max(0, ORDER_STAGES.indexOf(stage));
 const timeline=ORDER_STAGES.map((s,i)=>{
  const state = i<stageIdx?'done':(i===stageIdx?'on':'todo');
  const color = state==='todo' ? 'var(--faint)' : (state==='on'?'var(--accent)':'var(--ok)');
  return `<div style="display:flex;flex-direction:column;align-items:center;flex:1">
    <div style="width:14px;height:14px;border-radius:50%;background:${color}"></div>
    <div style="font-size:12px;margin-top:6px;color:${state==='todo'?'var(--muted)':'var(--ink)'};font-weight:${state==='on'?'700':'500'}">${esc(s)}</div>
   </div>`;
 }).join(`<div style="flex:1;height:2px;background:var(--line);margin-top:6px"></div>`);
 const nextBtn = stageIdx<ORDER_STAGES.length-1
  ? `<button class="btn ghost sm" onclick="advanceOrderStage('${id}')">→ ${esc(ORDER_STAGES[stageIdx+1])}</button>`
  : '';

 const itemRows=o.items.map(it=>{
  const p=db.products.find(x=>x.id===it.productId);
  const unitPrice=p?Number(p.price)||0:0;
  const kindTag=p && p.kind && p.kind!=='ดิบ' ? ' <span class="chip">'+esc(p.kind)+'</span>' : '';
  const nameCell=p?`<button class="lnk" style="padding:0;color:var(--ink)" onclick="openProductDetail('${p.id}')">${esc(p.name)}</button>${kindTag}`:'—';
  return `<tr><td>${nameCell}</td><td class="num">${esc(it.qty)}</td><td class="num">${baht(unitPrice)}</td><td class="num">${baht(unitPrice*it.qty)}</td></tr>`;
 }).join('');

 const chainDocs=db.docs.filter(d=>d.orderId===id);
 const chainRows=chainDocs.length ? chainDocs.map(d=>
  `<div class="li"><div class="main"><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openDocDetail('${d.id}')">${esc(d.number)}</button><div class="m">${esc(d.type)} · ${thDate(d.date)}</div></div><span class="chip c-${esc(d.status)}">${esc(d.status)}</span></div>`
 ).join('') : `<div class="empty">ยังไม่มีเอกสารผูกกับออเดอร์นี้</div>`;

 const latestIv=chainDocs.filter(d=>d.type==='ใบแจ้งหนี้').slice(-1)[0];
 let nextDocAction='';
 if(!chainDocs.length){
  nextDocAction=`<button class="btn sm" onclick="openDocForm('ใบเสนอราคา','','${id}')">ออกใบเสนอราคา</button>
   <button class="btn ghost sm" onclick="openDocForm('ใบแจ้งหนี้','','${id}')">ออกใบแจ้งหนี้</button>`;
 } else if(latestIv && latestIv.status==='ส่งแล้ว'){
  nextDocAction=`<button class="btn sm" style="background:var(--ok)" onclick="receivePayment('${latestIv.id}'); openOrderDetail('${id}')">รับชำระ</button>`;
 }

 showDetailPage(`ออเดอร์ ${thDate(o.date)}`, c?esc(c.name):'—', `
  <div style="display:flex;align-items:flex-start;margin-bottom:22px">${timeline}</div>
  <div style="text-align:center;margin-bottom:20px">${nextBtn}</div>
  <div class="grid g3" style="margin-bottom:16px">
   <div class="fld" style="margin-bottom:0"><label>ลูกค้า</label><div>${c?`<button class="lnk" style="padding:0;color:var(--ink);font-weight:600" onclick="openCustomerDetail('${c.id}')">${esc(c.name)}</button>`:'—'}</div></div>
   <div class="fld" style="margin-bottom:0"><label>ผู้รับผิดชอบ</label><select id="od_assignee" onchange="setOrderAssignee('${id}')">${activeStaffOptions(o.assigneeId)}</select></div>
   <div class="fld" style="margin-bottom:0"><label>ช่องทางชำระเงิน</label><select id="od_payment" onchange="setOrderPayment('${id}')">${paymentMethodOptions(o.paymentMethod)}</select></div>
  </div>
  <div style="font-size:13.5px;font-weight:700;margin-bottom:8px">รายการสินค้า</div>
  ${tbl(['สินค้า',['จำนวน','num'],['ราคา/หน่วย','num'],['รวม','num']], itemRows)}
  ${orderProfitBox(o)}
  <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px;flex-wrap:wrap;gap:8px">
   <div style="font-size:13.5px;font-weight:700">โซ่เอกสารของออเดอร์</div>
   <div>${nextDocAction}</div>
  </div>
  <div class="rowlist">${chainRows}</div>
 `, {wide:true});
}

 });

 return html+tbl(['วันที่','ประเภท',['จำนวน','num'],'หมวด','โน้ต',['จัดการ','act']], rows);

function saveMoney(id){
 const date=val('moDate')||todayStr();
 const type=val('moType');
 const amount=Number(val('moAmt'));
 const note=val('moNote');
 const category=val('moCat');
 const vatAmt=Number(val('moVat'))||0;
 const whtAmt=Number(val('moWht'))||0;
 const payeeName=val('moPayeeName'), payeeTaxId=val('moPayeeTaxId'), whtRate=Number(val('moWhtRate'))||0;
 const payeePersonTypeEl=document.getElementById('moPayeePersonType');
 const payeePersonType=payeePersonTypeEl?payeePersonTypeEl.value:'บุคคล';
 const unpaidEl=document.getElementById('moUnpaid');
 const unpaid=type==='ออก' && !!(unpaidEl && unpaidEl.checked);
 if(!(amount>0)){ alert('กรอกจำนวนเงินให้มากกว่า 0'); return; }
 markReopenedIfClosed(date.slice(0,7));
 if(id){
  const m=db.money.find(x=>x.id===id);
  if(m){ markReopenedIfClosed(String(m.date||'').slice(0,7)); m.date=date; m.type=type; m.amount=amount; m.note=note; m.category=category; m.unpaid=unpaid; m.vatAmt=vatAmt; m.whtAmt=whtAmt; m.payeeName=payeeName; m.payeeTaxId=payeeTaxId; m.payeePersonType=payeePersonType; m.whtRate=whtRate; }
 }else{
  db.money.unshift({id:uid(), date, type, amount, note, category, unpaid, orderId:null, refType:null, refId:null, vatAmt, whtAmt, payeeName, payeeTaxId, payeePersonType, whtRate});
 }
 save(); closeModal(); render();
}

/* ⭐ จุดกลายพันธุ์เดียวสำหรับเงินที่โพสต์อัตโนมัติข้ามโมดูล (รับชำระเอกสาร / จ่ายเงินเดือน) — ต้องมี refType+refId ผูกกลับเสมอ */
function addMoneyRow(type, amount, note, extra){
 const row=Object.assign({id:uid(), date:todayStr(), type, amount:Number(amount)||0, note:note||'', category:'', unpaid:false, orderId:null, refType:null, refId:null}, extra||{});
 db.money.unshift(row);
 save();
 return row;
}
