/* ============ helper เสริมสำหรับโมดูลใหม่ (เอกสาร/บัญชี/พนักงาน/เงินเดือน) ============ */
function thYear(){ return String(new Date().getFullYear()+543); }
function pad2(n){ return String(n).padStart(2,'0'); }
/* ⭐ กำไรขั้นต้นต่อออเดอร์ — เคยอยู่ในแท็บบัญชี ย้ายมาโชว์ในหน้ารายละเอียดออเดอร์แทน (ตรงจุดกว่า)
   กติกาสำคัญ: สินค้าที่ยังไม่กรอกต้นทุน (undefined/null) **ห้ามเดาเป็น 0** ให้ขึ้น "–" ทั้งแถว
   ไม่งั้นจอจะยืนยันว่า "กำไรเยอะ" ทั้งที่จริงแค่ "ยังไม่รู้ต้นทุน" */
function orderCostInfo(o){
 let cost=0, complete=true;
 for(const it of o.items){
  const p=db.products.find(x=>x.id===it.productId);
  if(!p || p.cost===undefined || p.cost===null || p.cost===''){ complete=false; continue; }
  cost += (Number(p.cost)||0)*Number(it.qty||0);
 }
 return {cost, complete};
}
function orderProfitBox(o){
 const sale=orderTotal(o);
 const {cost,complete}=orderCostInfo(o);
 if(!complete) return `<div class="card" style="margin-top:12px;background:#fffbeb;border-color:#fde68a"><div style="font-size:13px;color:var(--muted)">กำไรขั้นต้น: <b>–</b> · ยังกรอกต้นทุนสินค้าไม่ครบ จึงยังคำนวณกำไรไม่ได้ (ไม่เดาให้)</div></div>`;
 const profit=sale-cost;
 const margin=sale>0 ? ((profit/sale)*100).toFixed(1)+'%' : '–';
 return `<div class="card" style="margin-top:12px"><div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px">
  <div>ยอดขาย <b>${baht(sale)}</b></div><div>ต้นทุน <b>${baht(cost)}</b></div>
  <div>กำไรขั้นต้น <b class="${profit>=0?'money-pos':'money-neg'}">${baht(profit)}</b></div><div>มาร์จิ้น <b>${margin}</b></div></div></div>`;
}

/* ============ helper ที่เคยอยู่ในแท็บบัญชี/จัดซื้อ — ย้ายมาไว้ตรงนี้ตอนตัดเหลือ 9 แท็บ ============
   ทั้ง 5 ตัวนี้ยังมีคนเรียกจากแท็บที่เหลืออยู่ (การเงิน/เอกสาร/เงินเดือน/แกนกลาง) จึงห้ามตัดทิ้งไปกับแท็บ */
function accMonths(){
 // เดือนล่าสุด 6 เดือน (รวมเดือนนี้) เรียงเก่า→ใหม่ — คำนวณสด ไม่เก็บ
 const list=[];
 const now=new Date();
 for(let i=5;i>=0;i--){
  const dt=new Date(now.getFullYear(), now.getMonth()-i, 1);
  list.push(dt.getFullYear()+'-'+pad2(dt.getMonth()+1));
 }
 return list;
}
function moneyCategoryOptions(type, selected){
 const list=(type==='ออก'?db.categories.out:db.categories.in).slice();
 if(selected && !list.includes(selected)) list.unshift(selected); // แถวเก่าที่หมวดถูกลบ/เป็นข้อความอิสระ ยังเลือกอยู่ได้
 return list.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}
function monthCloseFor(period){ return db.monthCloses.find(m=>m.period===period); }
function markReopenedIfClosed(ym){
 const c=monthCloseFor(ym);
 if(c && !c.reopened){ c.reopened=true; save(); }
}
function markBillPaid(id){
 const m=db.money.find(x=>x.id===id);
 if(!m || !m.unpaid) return;
 m.unpaid=false; save(); render();
}

function pad3(n){ return String(n).padStart(3,'0'); }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function diffDaysInclusive(from,to){
 if(!from||!to) return 0;
 const a=new Date(from+'T00:00:00'), b=new Date(to+'T00:00:00');
 const d=Math.round((b-a)/86400000)+1;
 return d>0?d:0;
}

/* ============ ค่าคงที่+สูตรภาษี/ปกส./ชดเชย — SoT = homeoffice/workers/src/engines/{payroll,tax,severance}.js อ่านแล้วทำตามเป๊ะ ============ */
/* เงิน: ปัดทศนิยม 2 ตำแหน่งแบบ round-half-up เหมือน toMoney() ในไฟล์จริง (decimal.js ROUND_HALF_UP) */
function roundMoney(n){ n=Number(n)||0; const sign=n<0?-1:1; return sign*Math.round((Math.abs(n)+Number.EPSILON)*100)/100; }
/* ขั้นบันไดภาษีเงินได้บุคคลธรรมดา (รายปี) — ตรงกับ supabase/migrations seed_reference.sql (pit_bracket) เป๊ะ ⚠เปลี่ยนได้ทุกปี ตรวจกับสรรพากรก่อนใช้จริง */
const PIT_BRACKETS=[
 {upTo:150000, rate:0}, {upTo:300000, rate:5}, {upTo:500000, rate:10}, {upTo:750000, rate:15},
 {upTo:1000000, rate:20}, {upTo:2000000, rate:25}, {upTo:5000000, rate:30}, {upTo:null, rate:35}
];
function pitAnnual(taxable, brackets){
 brackets=brackets||PIT_BRACKETS;
 let tax=0, lower=0; const t=Math.max(0, Number(taxable)||0);
 for(const b of brackets){
  const upper = b.upTo==null ? null : Number(b.upTo);
  const sliceTop = upper==null ? t : Math.min(t, upper);
  const slice = sliceTop-lower;
  if(slice>0) tax += slice*(Number(b.rate)/100);
  if(upper==null || t<=upper) break;
  lower=upper;
 }
 return roundMoney(tax);
}
/* ปกส.: ฐาน clamp [floor,cap] × rate% เพดาน maxMonthly — default 5% / 1,650–15,000 / เพดาน 750 บาท/เดือน */
function ssoOf(base, ratePct, floor, cap, maxMonthly){
 ratePct=ratePct??5; floor=floor??1650; cap=cap??15000; maxMonthly=maxMonthly??750;
 const b=Math.min(Math.max(Number(base)||0, floor), cap);
 return roundMoney(Math.min(b*ratePct/100, maxMonthly));
}
/* ภาษีหัก ณ ที่จ่ายรายเดือน = annualize(gross×12) − ค่าใช้จ่าย 50%(เพดาน 100,000) − ลดหย่อนส่วนตัว 60,000 − ปกส.ทั้งปี → เข้า bracket → ÷12 */
function computePitMonthly(gross, ssoMonthly, opts){
 opts=opts||{};
 const annualIncome=(Number(gross)||0)*12;
 const expense=Math.min(annualIncome*(opts.expensePct??50)/100, opts.expenseCap??100000);
 const ssoAnnual=(Number(ssoMonthly)||0)*12;
 const taxableAnnual=Math.max(annualIncome-expense-(opts.personal??60000)-ssoAnnual, 0);
 return roundMoney(pitAnnual(taxableAnnual, opts.brackets)/12);
}
/* อัตรารายชั่วโมงคิด OT (ฐานกฎหมาย): เงินเดือน÷30÷8 · รายวัน = dailyRate÷8 (ส่วนขยายเทียบเท่า — ไม่มีในสูตรต้นฉบับซึ่งรองรับเฉพาะพนักงานรายเดือน) */
function hourlyRateOf(staff){
 const base = staff.payType==='รายวัน' ? (Number(staff.dailyRate)||0) : (Number(staff.salary)||0)/30;
 return roundMoney(base/8);
}
/* ============ ค่าชดเชยเลิกจ้าง ม.118 (พ.ร.บ.คุ้มครองแรงงาน) — SoT = severance.js เป๊ะ ============ */
function yearsOfService(startDate, endDate){
 if(!startDate) return 0;
 const s=new Date(startDate+'T00:00:00'), e=endDate?new Date(endDate+'T00:00:00'):new Date();
 const days=(e-s)/86400000;
 return days>0 ? days/365 : 0;
}
/* อัตราวัน: <120วัน=0 · <1ปี=30 · <3ปี=90 · <6ปี=180 · <10ปี=240 · <20ปี=300 · ≥20ปี=400 */
function severanceDays(years, startDate, endDate){
 const s=startDate?new Date(startDate+'T00:00:00'):null;
 const e=endDate?new Date(endDate+'T00:00:00'):new Date();
 const days = s ? (e-s)/86400000 : 0;
 if(days<120) return 0;
 if(years<1) return 30;
 if(years<3) return 90;
 if(years<6) return 180;
 if(years<10) return 240;
 if(years<20) return 300;
 return 400;
}
function computeSeverance({startDate, endDate, monthlySalary, includeNotice}){
 includeNotice = includeNotice===undefined ? true : includeNotice;
 const years=yearsOfService(startDate, endDate);
 const dailyWage=(Number(monthlySalary)||0)/30;
 const days=severanceDays(years, startDate, endDate);
 const severance=dailyWage*days;
 const noticeDays = includeNotice && days>0 ? 30 : 0;
 const noticePay=dailyWage*noticeDays;
 return { years:Math.round(years*100)/100, severanceDays:days, dailyWage:roundMoney(dailyWage), severance:roundMoney(severance), noticeDays, noticePay:roundMoney(noticePay), total:roundMoney(severance+noticePay) };
}
/* ============ WHT (หัก ณ ที่จ่าย) — SoT = tax.js: อัตราตามประเภทเงินได้ ============ */
const WHT_TYPES=[
 {code:'service', label:'ค่าบริการ/รับเหมา', rate:3},
 {code:'transport', label:'ค่าขนส่ง', rate:1},
 {code:'advertising', label:'ค่าโฆษณา', rate:2},
 {code:'rent', label:'ค่าเช่า', rate:5},
 {code:'professional', label:'วิชาชีพอิสระ', rate:3}
];
function computeWht(base, ratePct){ return roundMoney((Number(base)||0)*(Number(ratePct)||0)/100); }
/* ============ PromptPay QR payload (EMVCo) — SoT = lib/promptpay.js พอร์ตมาตรงตัว ============ */
function ppTlv(id, value){ const len=String(value.length).padStart(2,'0'); return `${id}${len}${value}`; }
function ppCrc16(str){
 let crc=0xffff;
 for(let i=0;i<str.length;i++){
  crc ^= str.charCodeAt(i)<<8;
  for(let j=0;j<8;j++) crc = (crc&0x8000) ? ((crc<<1)^0x1021)&0xffff : (crc<<1)&0xffff;
 }
 return crc.toString(16).toUpperCase().padStart(4,'0');
}
function ppAcctInfo(mobile, nationalId){
 const aid=ppTlv('00','A000000677010111');
 let target;
 if(mobile){ target=ppTlv('01', '0066'+mobile.replace(/\D/g,'').replace(/^0/,'')); }
 else{ target=ppTlv('02', (nationalId||'').replace(/\D/g,'')); }
 return ppTlv('29', aid+target);
}
function buildPromptPayPayload(mobile, nationalId, amount){
 if(!mobile && !nationalId) return null;
 let p = ppTlv('00','01') + ppTlv('01', amount?'12':'11') + ppAcctInfo(mobile, nationalId) + ppTlv('53','764') + (amount?ppTlv('54', roundMoney(amount).toFixed(2)):'') + ppTlv('58','TH');
 p += '6304';
 return p+ppCrc16(p);
}

/* ============ helper กลาง: ลงเวลา/OT/เงินเดือน (ใช้ร่วมกันหลายแท็บ — คำนวณสดจาก db เสมอ) ============ */
/* ⭐ เข้างานหลัง workStart (หรือกะของพนักงานคนนั้นถ้ามี) = มาสาย (เทียบสตริง HH:MM ตรง ๆ — nowHM() pad2 เสมอจึงเทียบ lexical ได้)
   staffId ไม่ใส่ = เทียบกับ workStart กลาง (backward-compat) · ใส่ staffId = เทียบกับกะของคนนั้น (fallback workStart ถ้าไม่ได้ตั้งกะ) */
function shiftStartFor(staffId){
 const s = staffId ? db.staff.find(x=>x.id===staffId) : null;
 const shift = s && s.shiftId ? db.shifts.find(x=>x.id===s.shiftId) : null;
 return shift ? shift.start : (db.workStart||'09:00');
}
function isLate(inTime, staffId){ return String(inTime||'') > String(shiftStartFor(staffId)); }
function isHoliday(date){ return db.holidays.some(h=>h.date===date); }
function presentDaysInMonth(staffId, ym){
 return db.timelogs.filter(t=>t.staffId===staffId && String(t.date||'').slice(0,7)===ym && t.in).length;
}
function lateDaysInMonth(staffId, ym){
 return db.timelogs.filter(t=>t.staffId===staffId && String(t.date||'').slice(0,7)===ym && t.in && !isHoliday(t.date) && isLate(t.in, staffId)).length;
}
/* ลาเดือนนี้ = รวมจำนวนวันลาที่ตัดช่วงให้อยู่ในเดือนนั้น (ใบลาคาบเกี่ยวหลายเดือนได้) */
function monthRange(ym){
 const [y,m]=ym.split('-').map(Number);
 const lastDay=new Date(y,m,0).getDate();
 return { start: ym+'-01', end: ym+'-'+pad2(lastDay) };
}
function leaveDaysInMonth(staffId, ym){
 const {start,end}=monthRange(ym);
 let total=0;
 db.leaves.filter(l=>l.staffId===staffId && (l.status||'อนุมัติ')==='อนุมัติ').forEach(l=>{
  const from = l.dateFrom>start ? l.dateFrom : start;
  const to = l.dateTo<end ? l.dateTo : end;
  if(from<=to) total += diffDaysInclusive(from,to);
 });
 return total;
}
function otSumInMonth(staffId, ym){
 const logs=db.otlogs.filter(o=>o.staffId===staffId && String(o.date||'').slice(0,7)===ym);
 const hours=logs.reduce((s,o)=>s+(Number(o.hours)||0),0);
 const amt=logs.reduce((s,o)=>s+(Number(o.hours)||0)*(Number(o.rate)||0),0);
 return {hours,amt};
}
/* งวด "2569-07" (พ.ศ.) → "2026-07" (ค.ศ.) เพื่อกรองทะเบียนลงเวลา/OT ที่เก็บเป็น ค.ศ. */
function periodToYm(period){
 const m=String(period||'').match(/^(\d{4})-(\d{2})$/);
 if(!m) return todayStr().slice(0,7);
 return (Number(m[1])-543)+'-'+m[2];
}
/* ⭐ รายวัน = dailyRate × จำนวนวันที่มีเช็คอินในเดือนนั้น · รายเดือน = เงินเดือนเดิม */
function computeBaseWage(staffId, payType, salary, dailyRate, ym){
 if(payType==='รายวัน'){
  const days=presentDaysInMonth(staffId, ym);
  return {wage:(Number(dailyRate)||0)*days, presentDays:days};
 }
 return {wage:Number(salary)||0, presentDays:null};
}
/* ⭐ ประกอบแถวงวดเงินเดือนจากทะเบียนพนักงาน+ลงเวลา+OT ปัจจุบัน — เรียกครั้งเดียวตอนสร้างงวด/เปลี่ยนงวดก่อนบันทึก แล้ว "แช่แข็ง" ลง rows (ดู savePayroll) */
/* พารามิเตอร์ ssoRate/ssoCap คงชื่อ+ตำแหน่งเดิม (backward-compat กับ verify-hracc.mjs test1/2 ที่เรียก buildPayrollRows(period,5,750))
   ssoCap = เพดานบาท/เดือน (default 750) · ssoFloor/ssoSalaryCap = ช่วง clamp ฐาน [1,650–15,000] (ใหม่ ไม่ใส่ = ใช้ default) */
function buildPayrollRows(period, ssoRate, ssoCap, ssoFloor, ssoSalaryCap){
 ssoFloor = ssoFloor===undefined ? 1650 : ssoFloor;
 ssoSalaryCap = ssoSalaryCap===undefined ? 15000 : ssoSalaryCap;
 const ym=periodToYm(period);
 return db.staff.filter(s=>!s.terminatedAt).map(s=>{
  const payType=s.payType==='รายวัน'?'รายวัน':'รายเดือน';
  const dailyRate=Number(s.dailyRate)||0;
  const base=computeBaseWage(s.id, payType, s.salary, dailyRate, ym);
  const ot=otSumInMonth(s.id, ym);
  const items=(s.payItems||[]).map(pi=>({name:pi.name, kind:pi.kind, amount:Number(pi.amount)||0, taxable:!!pi.taxable}));
  const addTaxable=items.filter(pi=>pi.kind==='เพิ่ม'&&pi.taxable).reduce((sum,pi)=>sum+pi.amount,0);
  const addNonTaxable=items.filter(pi=>pi.kind==='เพิ่ม'&&!pi.taxable).reduce((sum,pi)=>sum+pi.amount,0);
  const packageDeduct=items.filter(pi=>pi.kind==='หัก').reduce((sum,pi)=>sum+pi.amount,0);
  /* ฐานคำนวณปกส./ภาษี = ค่าจ้าง+OT+เงินเพิ่มที่ต้องเสียภาษี (เงินเพิ่มไม่เสียภาษี/เงินหัก ไม่กระทบฐานนี้ — ส่วนขยายจาก payroll.js ซึ่งรองรับแค่ earnings ก้อนเดียว) */
  const gross=base.wage+(Number(ot.amt)||0)+addTaxable;
  const ssoAmt=ssoOf(gross, ssoRate, ssoFloor, ssoSalaryCap, ssoCap);
  const taxAmt=computePitMonthly(gross, ssoAmt);
  return {staffId:s.id, name:s.name, payType, dailyRate, presentDays:base.presentDays, salary:base.wage, otHours:ot.hours, otAmt:ot.amt,
   packageItems:items, addTaxable, addNonTaxable, packageDeduct, gross,
   ssoRate, ssoFloor, ssoSalaryCap, ssoAmt, taxAmt, otherDeduct:0, net:0};
 });
}

/* ============ ก้อนที่ 11: แท็บเอกสารการค้า (docs) — เลขรันอัตโนมัติ + flow QT→IV→RC ============ */
/* เดโม่เอกสาร/รายการเงินของ BizSuite เดิมถูกล้างออกแล้ว (โจทย์ธุรกิจแก๊สล้วน) — ออกเอกสารจริงเองที่แท็บนี้ */
(function seedDocs(){
 if(db.demoCleared) return;
 if(db.docs.length) return;
 if(!db.customers.length) return; // ต้องมีลูกค้าก่อนถึง seed ได้
})();

registerModule({key:'docs', ic:'docs', label:'เอกสารการค้า', render:renderDocs});

function docPrefix(type){ return type==='ใบเสนอราคา'?'QT':(type==='ใบแจ้งหนี้'?'IV':'RC'); }
/* ⭐ เลขรันอัตโนมัติ: max ที่เคยใช้ +1 เสมอ ห้ามนับจำนวนแถว (ลบแล้วเลขจะซ้ำ) แยก counter ต่อประเภท+ปี */
function nextDocNumber(type){
 const p=docPrefix(type), y=thYear();
 if(!db.docCounters[p]) db.docCounters[p]={};
 const n=(db.docCounters[p][y]||0)+1;
 db.docCounters[p][y]=n;
 save();
 return `${p}-${y}-${pad3(n)}`;
}

function renderDocs(){
 let html=head('เอกสารการค้า','ใบเสนอราคา · ใบแจ้งหนี้ · ใบเสร็จ — เลขที่ออกอัตโนมัติ','openDocFormNew');
 if(!db.docs.length) return html+empty('ยังไม่มีเอกสาร กดปุ่ม + เพิ่ม');
 const rows=db.docs.map(d=>{
  const c=db.customers.find(x=>x.id===d.customerId);
  const cname=c?`<button class="lnk" style="padding:0;color:var(--ink)" onclick="openCustomerDetail('${c.id}')">${esc(c.name)}</button>`:'—';
  let act=`<button class="lnk" onclick="printDoc('${d.id}')">พิมพ์</button>`;
  if(d.status==='ร่าง'){
   act+=`<button class="lnk" onclick="openDocForm('${d.type}','${d.id}')">แก้</button>`;
   act+=`<button class="lnk" style="color:var(--ok)" onclick="advanceDocSent('${d.id}')">ทำเครื่องหมายว่าส่งแล้ว</button>`;
   act+=`<button class="lnk del" onclick="delRow('docs','${d.id}')">ลบ</button>`;
  }
  if(d.type==='ใบเสนอราคา'){
   act+=`<button class="lnk" onclick="convertToInvoice('${d.id}')">แปลงเป็นใบแจ้งหนี้</button>`;
  }
  if(d.type==='ใบแจ้งหนี้' && d.status==='ส่งแล้ว'){
   act+=`<button class="lnk" style="color:var(--ok)" onclick="receivePayment('${d.id}')">รับชำระ</button>`;
  }
  return `<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openDocDetail('${d.id}')">${esc(d.number)}</button></td>
   <td>${esc(d.type)}</td>
   <td>${cname}</td>
   <td>${thDate(d.date)}</td>
   <td class="num">${baht(d.amount)}</td>
   <td><span class="chip c-${esc(d.status)}">${esc(d.status)}</span></td>
   <td class="act">${act}</td>
  </tr>`;
 }).join('');
 return html+tbl(['เลขที่','ประเภท','ลูกค้า','วันที่',['ยอดรวม','num'],'สถานะ',['จัดการ','act']], rows);
}

/* เปลี่ยนลูกค้าในฟอร์มเอกสาร → โชว์/ซ่อนช่อง WHT ตามประเภทบุคคลสด */
function docFormCustChanged(){

function saveDoc(id){
 const type=val('d_type');
 const customerId=val('d_cust');
 const orderId=val('d_orderId')||null;
 const note=val('d_note');
 const names=[...document.querySelectorAll('#d_items .di-name')];
 const qtys=[...document.querySelectorAll('#d_items .di-qty')];
 const prices=[...document.querySelectorAll('#d_items .di-price')];
 const items=[];
 names.forEach((el,i)=>{
  const name=el.value.trim();
  const qty=Number(qtys[i]?qtys[i].value:0);
  const price=Number(prices[i]?prices[i].value:0);
  if(name && qty>0) items.push({name, qty, price});
 });
 if(!customerId){ alert('เลือกลูกค้าก่อน'); return; }
 if(!items.length){ alert('ใส่รายการอย่างน้อย 1 รายการ (ชื่อ+จำนวน)'); return; }
 const amount=items.reduce((s,it)=>s+it.qty*it.price,0);
 /* ⭐ VAT เป็น snapshot ในเอกสาร: amount=ยอดรวม (แตกจาก 1.07) กันปัดเศษเพี้ยนด้วยการปัด baseAmt ก่อนแล้วลบหา vatAmt */
 const vatEl=document.getElementById('d_vat');
 const useVat=!!(vatEl && vatEl.checked);
 let vatRate=null, vatAmt=null, baseAmt=null;
 if(useVat){
  vatRate=7;
  baseAmt=Math.round((amount/1.07)*100)/100;
  vatAmt=Math.round((amount-baseAmt)*100)/100;
 }
 /* ⭐ WHT คิดจากฐานก่อน VAT (baseAmt ถ้ามี VAT ไม่งั้น=amount) — หักได้เฉพาะลูกค้านิติบุคคล กันมั่ว */
 const cust=db.customers.find(x=>x.id===customerId);
 const whtEl=document.getElementById('d_wht');
 let whtType=null, whtRate=null, whtAmt=null;
 if(type==='ใบแจ้งหนี้' && cust && cust.personType==='นิติบุคคล' && whtEl && whtEl.value){
  const w=WHT_TYPES.find(x=>x.code===whtEl.value);
  if(w){ whtType=w.code; whtRate=w.rate; whtAmt=computeWht(useVat?baseAmt:amount, w.rate); }
 }
 const transferAmt = whtAmt!=null ? roundMoney(amount-whtAmt) : null;
 markReopenedIfClosed(todayStr().slice(0,7));
 if(id){
  const d=db.docs.find(x=>x.id===id);
  if(d && d.status==='ร่าง'){ d.customerId=customerId; d.items=items; d.amount=amount; d.note=note; d.vatRate=vatRate; d.vatAmt=vatAmt; d.baseAmt=baseAmt; d.whtType=whtType; d.whtRate=whtRate; d.whtAmt=whtAmt; d.transferAmt=transferAmt; }
 }else{
  db.docs.unshift({id:uid(), type, number:nextDocNumber(type), customerId, orderId, items, amount, date:todayStr(), status:'ร่าง', note, vatRate, vatAmt, baseAmt, whtType, whtRate, whtAmt, transferAmt});
 }
 save(); closeModal(); render();
}

function advanceDocSent(id){

 if(!d || d.status!=='ร่าง') return;
 d.status='ส่งแล้ว'; save(); render();

/* ⭐ แปลงใบเสนอราคา → ใบแจ้งหนี้: copy items (snapshot ใหม่) + เลขรันใหม่ ไม่แก้เอกสารต้นทาง */
function convertToInvoice(qtId){
 const qt=db.docs.find(x=>x.id===qtId);
 if(!qt || qt.type!=='ใบเสนอราคา') return;
 const iv={id:uid(), type:'ใบแจ้งหนี้', number:nextDocNumber('ใบแจ้งหนี้'), customerId:qt.customerId, orderId:qt.orderId, items:qt.items.map(it=>({...it})), amount:qt.amount, date:todayStr(), status:'ส่งแล้ว', note:'แปลงจาก '+qt.number, sourceDocId:qt.id, vatRate:qt.vatRate||null, vatAmt:qt.vatAmt||null, baseAmt:qt.baseAmt||null, whtType:qt.whtType||null, whtRate:qt.whtRate||null, whtAmt:qt.whtAmt||null, transferAmt:qt.transferAmt||null};
 db.docs.unshift(iv);
 save(); render();
 return iv.id;
}

/* ⭐ รับชำระ: กันกดซ้ำด้วยการเช็คสถานะ IV ก่อนเสมอ (สถานะเปลี่ยนแล้วปุ่มหาย) — ออกใบเสร็จ + ลงเงินเข้า 1 แถวผูกกลับด้วย refId
   ยอดเงินที่รับจริง = amount − whtAmt (ผู้ซื้อหักไว้แล้วก่อนโอน) — vatAmt/whtAmt เป็น metadata ให้สรุปภาษี */
function receivePayment(ivId){
 const iv=db.docs.find(x=>x.id===ivId);
 if(!iv || iv.type!=='ใบแจ้งหนี้' || iv.status!=='ส่งแล้ว') return; // กันกดซ้ำ
 markReopenedIfClosed(todayStr().slice(0,7));
 const rc={id:uid(), type:'ใบเสร็จ', number:nextDocNumber('ใบเสร็จ'), customerId:iv.customerId, orderId:iv.orderId, items:iv.items.map(it=>({...it})), amount:iv.amount, date:todayStr(), status:'ชำระแล้ว', note:'รับชำระจาก '+iv.number, sourceDocId:iv.id, vatRate:iv.vatRate||null, vatAmt:iv.vatAmt||null, baseAmt:iv.baseAmt||null, whtType:iv.whtType||null, whtRate:iv.whtRate||null, whtAmt:iv.whtAmt||null, transferAmt:iv.transferAmt||null};
 db.docs.unshift(rc);
 const received = iv.whtAmt ? roundMoney(iv.amount-iv.whtAmt) : iv.amount;
 addMoneyRow('เข้า', received, 'รับชำระ '+iv.number+(iv.whtAmt?' (หัก ณ ที่จ่ายแล้ว '+baht(iv.whtAmt)+')':''), {category:'ขาย', refType:'doc', refId:rc.id, vatAmt: iv.vatAmt||0, whtAmt: iv.whtAmt||0});
 iv.status='ชำระแล้ว';
 save(); render();
 return rc.id;
}

/* ⭐ โซ่เอกสารของออเดอร์/ลูกค้า — เดินย้อนไป root ผ่าน sourceDocId แล้วเดินหน้าอีกที (ใช้โชว์ breadcrumb QT→IV→RC) */
function docChain(id){
 let d=db.docs.find(x=>x.id===id);
 if(!d) return [];
 let root=d;
 while(root.sourceDocId){
  const parent=db.docs.find(x=>x.id===root.sourceDocId);
  if(!parent) break;
  root=parent;
 }
 const chain=[root];
 let cur=root;
 while(true){
  const next=db.docs.find(x=>x.sourceDocId===cur.id);
  if(!next) break;
  chain.push(next);
  cur=next;
 }
 return chain;
}

/* ============ หน้ารายละเอียดเอกสาร — breadcrumb โซ่ QT→IV→RC + ปุ่มขั้นถัดไปตามสถานะ ============ */
function openDocDetail(id){
 const d=db.docs.find(x=>x.id===id);
 if(!d) return;
 const c=db.customers.find(x=>x.id===d.customerId);
 const chain=docChain(id);
 const crumb=chain.map((cd,i)=>{
  const active=cd.id===id;
  return `${i>0?' <span style="color:var(--faint)">→</span> ':''}<button class="lnk" style="padding:2px 6px;${active?'font-weight:700;color:var(--accent)':'color:var(--muted)'}" onclick="openDocDetail('${cd.id}')">${esc(cd.number)}</button>`;
 }).join('');

 const itemRows=d.items.map(it=>`<tr><td>${esc(it.name)}</td><td class="num">${esc(it.qty)}</td><td class="num">${baht(it.price)}</td><td class="num">${baht(it.qty*it.price)}</td></tr>`).join('');

 let nextAction='';
 if(d.status==='ร่าง'){
  nextAction+=`<button class="btn ghost sm" onclick="openDocForm('${esc(d.type)}','${d.id}')">แก้</button>
   <button class="btn sm" onclick="advanceDocSent('${d.id}'); openDocDetail('${d.id}')">ทำเครื่องหมายว่าส่งแล้ว</button>`;
 }
 if(d.type==='ใบเสนอราคา'){
  nextAction+=`<button class="btn sm" onclick="const nid=convertToInvoice('${d.id}'); openDocDetail(nid||'${d.id}')">แปลงเป็นใบแจ้งหนี้</button>`;
 }
 if(d.type==='ใบแจ้งหนี้' && d.status==='ส่งแล้ว'){
  nextAction+=`<button class="btn sm" style="background:var(--ok)" onclick="const nid=receivePayment('${d.id}'); openDocDetail(nid||'${d.id}')">รับชำระ · ออกใบเสร็จ/ใบกำกับ</button>`;
 }
 nextAction+=`<button class="btn ghost sm" onclick="printDoc('${d.id}')">พิมพ์</button>`;

/* ============ ด่านก่อนออกใบกำกับภาษีเต็มรูป — จด VAT + เอกสารมี VAT ต้องมีเลขภาษี+ที่อยู่ผู้ซื้อครบ (ม.86/4) ============
   ธุรกิจไม่จด VAT ไม่ติดด่านเลย (ออกใบเสร็จธรรมดาได้ปกติ) */
function taxInvoiceProblems(customerId){
 const c=db.customers.find(x=>x.id===customerId);
 const problems=[];
 if(!c){ problems.push('ไม่พบข้อมูลลูกค้า'); return problems; }
 if(!c.taxId || !c.taxId.trim()) problems.push('ลูกค้ายังไม่มีเลขประจำตัวผู้เสียภาษี');
 if(!c.address || !c.address.trim()) problems.push('ลูกค้ายังไม่มีที่อยู่');
 return problems;
}
function showTaxGateBlock(d){
 const c=db.customers.find(x=>x.id===d.customerId);

/* ============ ตัวเลขเป็นตัวอักษรไทย (บาทถ้วน/สตางค์) — ใช้บนใบกำกับภาษีเต็มรูป ============ */
function bahtText(amountInput){
 const digitWords=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
 const posWords=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
 function numText(n){
  if(!n || n==='0') return '';
  const chunks=[]; let s=n;
  while(s.length>0){ chunks.unshift(s.slice(-6)); s=s.slice(0,-6); }
  let out='';
  chunks.forEach((chunk,ci)=>{
   const isLast=ci===chunks.length-1;
   const digits=chunk.split('').map(Number);
   const len=digits.length;
   let chunkText='';
   digits.forEach((d,i)=>{
    if(d===0) return;
    const posFromRight=len-1-i;
    if(posFromRight===0){
     chunkText += (d===1 && len>1) ? 'เอ็ด' : digitWords[d];
    } else if(posFromRight===1){
     chunkText += (d===1) ? 'สิบ' : (d===2 ? 'ยี่สิบ' : digitWords[d]+'สิบ');
    } else {
     chunkText += digitWords[d]+posWords[posFromRight];
    }
   });
   out += chunkText + (chunkText && !isLast ? 'ล้าน' : '');
  });
  return out;
 }
 let amount=Math.round((Number(amountInput)||0)*100)/100;
 const neg=amount<0; amount=Math.abs(amount);
 let [bahtPart, satangPart]=amount.toFixed(2).split('.');
 bahtPart=bahtPart.replace(/^0+(?=\d)/,'');
 const bahtWords=numText(bahtPart)||'ศูนย์';
 let text=bahtWords+'บาท';
 text += (satangPart==='00') ? 'ถ้วน' : (numText(satangPart)+'สตางค์');
 return (neg?'ลบ':'')+text;
}

 const qrBlock = (d.type==='ใบแจ้งหนี้' && d.status!=='ชำระแล้ว') ? renderPromptPayBlock(d.transferAmt!=null?d.transferAmt:d.amount) : '';

function staffPayLine(s){ return s.payType==='รายวัน' ? ('รายวัน '+baht(s.dailyRate||0)+'/วัน') : ('รายเดือน '+baht(s.salary||0)); }

 // แถบสลับ "รายชื่อ / ตำแหน่ง&JD" — ทะเบียนตำแหน่งเปิดให้เฉพาะเจ้าของกับหัวหน้า

   <button class="btn ${staffTab==='list'?'':'ghost'} sm" onclick="setStaffTab('list')">รายชื่อพนักงาน (${db.staff.filter(s=>visibleStaffIds().includes(s.id)).length})</button>

  </div>`;
 if(staffTab==='positions') return bar+renderPositions();
 return bar+renderStaffList();
}
function renderStaffList(){
 let html=head('พนักงาน','ทะเบียนพนักงาน — คลิกชื่อดูโปรไฟล์', canSeeMoney()?'openStaffForm':'');
 html+=`<div style="font-size:12.5px;color:var(--muted);margin:-8px 0 14px">ข้อมูลพนักงานอยู่ในเครื่องคุณเท่านั้น (ไม่ส่งขึ้นที่ไหน)</div>`;
 // ⭐ หัวหน้าเห็นเฉพาะแผนกตัวเอง · พนักงานเห็นเฉพาะตัวเอง — กรองที่ข้อมูล ไม่ใช่แค่ซ่อนปุ่ม
 const vis=visibleStaffIds();
 const list=db.staff.filter(s=>vis.includes(s.id));
 if(!list.length) return html+empty('ยังไม่มีพนักงาน กดปุ่ม + เพิ่ม');
 const money=canSeeMoney();   // ค่าจ้าง = ตัวเลขที่หัวหน้า/พนักงานไม่ควรเห็นของคนอื่น
 const rows=list.map(s=>`<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openStaffProfile('${s.id}')">${esc(s.name)}</button>${s.nickname?` <span style="color:var(--muted);font-size:12.5px">(${esc(s.nickname)})</span>`:''}</td>
   <td>${esc(positionName(s.positionId)||s.role||'—')}</td>
   <td>${s.phone?esc(s.phone):'—'}</td>
   ${money?`<td class="num">${staffPayLine(s)}</td>`:''}
   <td>${s.startDate?thDate(s.startDate):'—'}</td>
   <td>${s.terminatedAt?`<span class="chip c-หมด">พ้นสภาพ・${esc(s.terminationReason||'')}</span>`:`<span class="chip c-เสร็จ">ทำงานอยู่</span>`}</td>
   <td class="act">
    ${money?`<button class="lnk" onclick="openStaffForm('${s.id}')">แก้</button>
    <button class="lnk del" onclick="delStaff('${s.id}')">ลบ</button>`:'—'}
   </td>
  </tr>`).join('');
 const cols=['ชื่อ','ตำแหน่ง','เบอร์โทร'].concat(money?[['ค่าจ้าง','num']]:[]).concat(['เริ่มงาน','สถานะ',['จัดการ','act']]);
 return html+tbl(cols, rows);
}

function saveStaff(id){
 const name=val('stName');
 if(!name){ alert('กรอกชื่อพนักงานก่อน'); return; }
 const role=val('stRole'), phone=val('stPhone'), startDate=val('stStart'), note=val('stNote');
 const nickname=val('stNick'), dept=val('stDept'), shiftId=val('stShift');
 const positionId=val('stPosition');
 const accessRole=['owner','manager','staff'].includes(val('stAccess'))?val('stAccess'):'staff';
 const address=val('stAddr'), idCard=val('stIdCard'), bankName=val('stBankName'), bankAccount=val('stBankAcc');
 const payType=val('stPayType')==='รายวัน'?'รายวัน':'รายเดือน';
 const salary=Number(val('stSalary'))||0;
 const dailyRate=Number(val('stDaily'))||0;
 if(id){
  const s=db.staff.find(x=>x.id===id);
  if(s){ Object.assign(s, {name, role, dept, phone, payType, salary, dailyRate, startDate, note, nickname, shiftId, address, idCard, bankName, bankAccount, positionId, accessRole}); }
 }else{
  db.staff.push({id:uid(), name, role, dept, phone, payType, salary, dailyRate, startDate, note, nickname, shiftId, address, idCard, bankName, bankAccount, positionId, accessRole, salaryHistory:[], payItems:[], leaveQuotaOverride:{}, terminatedAt:null, terminationReason:'', terminationDate:'', severanceSnapshot:null});
 }
 save(); closeModal(); render();
}

/* ลบพนักงาน = cascade เตือนก่อนถ้ามีใบลา/ลงเวลา/OT ผูกอยู่ (กันข้อมูลกำพร้า) */
function delStaff(id){
 const leaveCount=db.leaves.filter(l=>l.staffId===id).length;
 const logCount=db.timelogs.filter(t=>t.staffId===id).length;
 const otCount=db.otlogs.filter(o=>o.staffId===id).length;
 const msg=(leaveCount||logCount||otCount) ? `พนักงานคนนี้มีใบลา ${leaveCount} ใบ, ประวัติลงเวลา ${logCount} รายการ และ OT ${otCount} รายการ ลบพนักงานแล้วจะลบข้อมูลเหล่านี้ด้วย ยืนยันไหม?` : 'ลบพนักงานคนนี้?';
 if(!confirm(msg)) return;
 db.staff=db.staff.filter(x=>x.id!==id);
 db.leaves=db.leaves.filter(x=>x.staffId!==id);
 db.timelogs=db.timelogs.filter(x=>x.staffId!==id);
 db.otlogs=db.otlogs.filter(x=>x.staffId!==id);
 save(); render();
}

 const tabsHtml=`<div style="display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:8px">${tabBtn('overview','ภาพรวม')}${tabBtn('package','แพคเกจ')}${tabBtn('docs','เอกสาร')}</div>`;

 else if(staffProfileTab==='docs') body=renderStaffDocsTab(s);

function renderStaffOverviewTab(s){
 const ym=todayStr().slice(0,7), yr=todayStr().slice(0,4);
 const present=presentDaysInMonth(s.id, ym);
 const late=lateDaysInMonth(s.id, ym);
 const leaveM=leaveDaysInMonth(s.id, ym);
 const leaveYearParts=db.leaveTypes.map(t=>`${esc(t)} ${leaveDaysUsed(s.id,t,yr)}/${leaveQuotaFor(s.id,t)} วัน`).join(' · ');
 const history=db.payrolls.filter(p=>p.rows.some(r=>r.staffId===s.id))

  .map(p=>{ const r=p.rows.find(x=>x.staffId===s.id); return `<tr><td>${esc(p.period)}</td><td class="num">${baht(r.net)}</td><td><span class="chip c-${esc(p.status)}">${esc(p.status)}</span></td></tr>`; }).join('');
 const heldOrders=db.orders.filter(o=>o.assigneeId===s.id && o.status!=='เสร็จ');

 }).join('') : `<div class="empty">ไม่มีงานค้าง ✓</div>`;
 return `<div class="grid g3" style="margin-bottom:16px">
   <div class="card stat" style="padding:12px 14px"><div class="lab">มาทำงานเดือนนี้</div><b>${present} วัน</b></div>
   <div class="card stat" style="padding:12px 14px"><div class="lab">มาสาย</div><b class="${late>0?'money-neg':''}">${late} วัน</b></div>

  </div>

   <button class="lnk" onclick="openStaffLeaveOverride('${s.id}')">แก้โควตาเฉพาะคน</button></div>
  <div style="font-size:13.5px;font-weight:700;margin-bottom:8px">งานที่ถืออยู่ (${heldOrders.length})</div>

function openStaffLeaveOverride(id){
 const s=db.staff.find(x=>x.id===id);
 if(!s) return;
 const rows=db.leaveTypes.map(t=>`<div class="fld"><label>${esc(t)}</label><input id="lqo_${esc(t)}" type="number" min="0" placeholder="ค่า default ${Number(db.leaveQuota[t])||0} วัน — เว้นว่าง=ใช้ default" value="${s.leaveQuotaOverride&&s.leaveQuotaOverride[t]!==undefined&&s.leaveQuotaOverride[t]!==null?s.leaveQuotaOverride[t]:''}"></div>`).join('');
 showFormPage(`โควตาลาเฉพาะคน — ${esc(s.name)}`, '', `
  <div style="font-size:12.5px;color:var(--muted);margin:-6px 0 12px">เว้นว่างช่องไหน = ใช้ค่า default ของบริษัท</div>
  ${rows}`, 'saveStaffLeaveOverride', id);
}
function saveStaffLeaveOverride(id){
 const s=db.staff.find(x=>x.id===id);
 if(!s) return;
 s.leaveQuotaOverride=s.leaveQuotaOverride||{};
 db.leaveTypes.forEach(t=>{
  const v=val('lqo_'+t);
  if(v===''||v===null||v===undefined) delete s.leaveQuotaOverride[t];
  else s.leaveQuotaOverride[t]=Number(v)||0;
 });
 save(); openStaffProfile(id);
}

/* ⭐ แพคเกจเงินเพิ่ม/เงินหักประจำต่อคน — ไหลเข้างวดเงินเดือนอัตโนมัติผ่าน buildPayrollRows */

/* composite id "staffId|idx" — savePress() ส่งได้แค่ 1 id ต่อครั้ง ต้องแยกเองในนี้ (idx ว่าง = เพิ่มใหม่) */
function savePayItem(compositeId){
 const [staffId, idxStr]=String(compositeId).split('|');
 const idx = idxStr===''||idxStr===undefined ? null : Number(idxStr);
 const s=db.staff.find(x=>x.id===staffId);
 if(!s) return;

 if(!name){ alert('กรอกชื่อรายการก่อน'); return; }

 const taxable=!!document.getElementById('piTaxable').checked;
 s.payItems=s.payItems||[];
 if(idx!==null && s.payItems[idx]) s.payItems[idx]={...s.payItems[idx], name, kind, amount, taxable};
 else s.payItems.push({id:uid(), name, kind, amount, taxable});
 save(); openStaffProfile(staffId);

function delPayItem(staffId, idx){

 if(!confirm('ลบรายการแพคเกจนี้?')) return;
 s.payItems.splice(idx,1);
 save(); openStaffProfile(staffId);
}

/* ============ ก้อนที่ 14: แท็บลงเวลา & ลา (timelogs + leaves) ============ */

/* ⭐ โควตาหักเฉพาะใบลาที่ "อนุมัติ" แล้ว (ใบลาเก่าไม่มี status = ถือว่าอนุมัติแล้ว backward-compat) */
function leaveDaysUsed(staffId, type, year){
 return db.leaves.filter(l=>l.staffId===staffId && l.type===type && (l.status||'อนุมัติ')==='อนุมัติ' && String(l.dateFrom||'').slice(0,4)===String(year))
  .reduce((s,l)=>s+(Number(l.days)||0),0);
}
function leaveTodayOf(staffId){
 return db.leaves.find(l=>l.staffId===staffId && (l.status||'อนุมัติ')==='อนุมัติ' && l.dateFrom<=todayStr() && l.dateTo>=todayStr());
}
/* โควตาต่อคน — override ที่ staff.leaveQuotaOverride[type] ถ้าตั้งไว้ ไม่งั้นใช้ค่า default db.leaveQuota[type] */
function leaveQuotaFor(staffId, type){
 const s=db.staff.find(x=>x.id===staffId);
 // ⭐ วันลาที่ยกยอดมาจากปีก่อน บวกทับโควตาปีนี้เสมอ (ไม่งั้นหน้า "ยกยอด" จะเป็นแค่ของประดับ)
 const carry=leaveCarryFor(staffId, new Date().getFullYear(), type);
 if(s && s.leaveQuotaOverride && s.leaveQuotaOverride[type]!==undefined && s.leaveQuotaOverride[type]!==null && s.leaveQuotaOverride[type]!=='') return (Number(s.leaveQuotaOverride[type])||0)+carry;
 return (Number(db.leaveQuota[type])||0)+carry;
}

}

/* เดือนที่เลือกดูสรุปรายคน — เก็บเป็นตัวแปรหน้าเว็บ ไม่ใช่ข้อมูลธุรกิจ */
let attSumMonth='';
function setAttSumMonth(v){ attSumMonth=v||todayStr().slice(0,7); render(); }

/* ⭐ ปฏิทินลาเดือนนี้แบบง่าย — แตกใบลาเป็นรายวันแล้วเรียงวัน */
function leaveCalendarThisMonth(){
 const ym=todayStr().slice(0,7);
 const {start,end}=monthRange(ym);
 const entries=[];
 db.leaves.forEach(l=>{
  const from = l.dateFrom>start ? l.dateFrom : start;
  const to = l.dateTo<end ? l.dateTo : end;
  if(from>to) return;
  let d=new Date(from+'T00:00:00');
  const last=new Date(to+'T00:00:00');
  while(d<=last){
   entries.push({date:d.toISOString().slice(0,10), staffId:l.staffId, type:l.type});
   d.setDate(d.getDate()+1);
  }
 });
 entries.sort((a,b)=>a.date.localeCompare(b.date));
 if(!entries.length) return `<div class="empty">เดือนนี้ยังไม่มีใครลา</div>`;
 return entries.map(e=>{
  const s=db.staff.find(x=>x.id===e.staffId);
  return `<div class="li"><div class="main"><div class="t">${s?esc(s.name):'—'}</div><div class="m">${thDate(e.date)}</div></div><span class="chip c-ใกล้หมด">${esc(e.type)}</span></div>`;
 }).join('');
}

/* ⭐ บันทึก OT — CRUD ในแท็บนี้ · rate = อัตราสุดท้ายที่ใช้จริง (ยังคำนวณ hours×rate เหมือนเดิมเป๊ะ) ·
   multiplier/baseRate = แค่ metadata ช่วยกรอก (baseRate×multiplier=rate) ไม่กระทบสูตรงวดเงินเดือนเดิม */

function otRecalcRate(){

 const base = s ? hourlyRateOf(s) : 0;

 if(hintEl) hintEl.textContent = s ? ('อัตรา/ชม. ฐาน (เงินเดือน÷30÷8) = '+baht(base)) : '';
}
function openOtForm(id){

 const staffOpts=db.staff.length
  ? db.staff.map(s=>`<option value="${s.id}" ${o&&o.staffId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')
  : `<option value="">— ยังไม่มีพนักงาน —</option>`;
 const mult=o?(o.multiplier||1):1.5;
 showFormPage(o?'แก้ไข OT':'บันทึก OT', '', `
  <div class="fld"><label>พนักงาน</label><select id="otStaff" onchange="otRecalcRate()">${staffOpts}</select></div>
  <div class="frow">
   <div class="fld"><label>วันที่</label><input id="otDate" type="date" value="${o?esc(o.date):todayStr()}"></div>
   <div class="fld"><label>ชั่วโมง</label><input id="otHours" type="number" min="0" step="0.5" value="${o?o.hours:''}" placeholder="0"></div>
  </div>
  <div class="frow">
   <div class="fld"><label>ตัวคูณ</label><select id="otMult" onchange="otRecalcRate()">
    <option value="1" ${mult===1?'selected':''}>1x</option>
    <option value="1.5" ${mult===1.5?'selected':''}>1.5x</option>
    <option value="2" ${mult===2?'selected':''}>2x</option>
    <option value="3" ${mult===3?'selected':''}>3x</option>
   </select></div>
   <div class="fld"><label>อัตรา (บาท/ชม. — แก้มือได้)</label><input id="otRate" type="number" min="0" value="${o?o.rate:''}" placeholder="0"></div>
  </div>
  <div id="otBaseHint" style="font-size:12px;color:var(--muted);margin:-8px 0 12px"></div>
  <div class="fld"><label>โน้ต</label><input id="otNote" value="${o?esc(o.note||''):''}"></div>`, 'saveOt', id);
 if(!o && db.staff.length) otRecalcRate();
}
function saveOt(id){
 const staffId=val('otStaff');
 const date=val('otDate')||todayStr();
 const hours=Number(val('otHours'));
 const multiplier=Number(val('otMult'))||1;
 const rate=Number(val('otRate'))||0;
 const note=val('otNote');
 const s=db.staff.find(x=>x.id===staffId);
 const baseRate=s?hourlyRateOf(s):0;
 if(!staffId){ alert('เลือกพนักงานก่อน'); return; }
 if(!(hours>0)){ alert('กรอกชั่วโมง OT มากกว่า 0'); return; }
 if(id){
  const o=db.otlogs.find(x=>x.id===id);
  if(o){ o.staffId=staffId; o.date=date; o.hours=hours; o.rate=rate; o.multiplier=multiplier; o.baseRate=baseRate; o.note=note; }
 }else{
  db.otlogs.unshift({id:uid(), staffId, date, hours, rate, multiplier, baseRate, note});
 }
 save(); closeModal(); render();
}

 html+=`<div class="card" style="margin-bottom:16px"><div class="ch">วันนี้ใครมา / ลา${holidayToday?` <span style="color:var(--accent);font-weight:600">· วันหยุด: ${esc(holidayToday.name)}</span>`:''}${lateToday?` <span style="color:var(--warn);font-weight:600">· มาสาย ${lateToday} คน</span>`:''}</div><div class="rowlist">${todayRows}</div></div>`;

 const months=accMonths();

 }).join('') : '';
 html+=`<div class="pagehead"><div><h3 style="font-size:16px">สรุปเดือนต่อคน</h3></div><select class="sel" onchange="setAttSumMonth(this.value)">${attMonthOpts}</select></div>`;
 html+= db.staff.length ? tbl(['พนักงาน',['มา','num'],['สาย','num'],['ลา','num'],['OT ชม.','num']], sumRows) : empty('ยังไม่มีพนักงาน');

 const yr=todayStr().slice(0,4);
 const types=db.leaveTypes;
 const quotaRows=activeStaff.length ? activeStaff.map(s=>{
  const parts=types.map(t=>{
   const used=leaveDaysUsed(s.id,t,yr);

   const left=quota-used;
   const overridden = s.leaveQuotaOverride && s.leaveQuotaOverride[t]!==undefined && s.leaveQuotaOverride[t]!==null && s.leaveQuotaOverride[t]!=='';
   return `${esc(t)} ${left}/${quota} วัน${overridden?' <span class="chip" style="background:#eff4ff;color:var(--accent);font-size:10px">ตั้งเฉพาะคน</span>':''}`;

 }).join('') : `<div class="empty">ยังไม่มีพนักงาน</div>`;
 html+=`<div class="card" style="margin:16px 0">
  <div class="ch">โควตาลาคงเหลือ (ปี ${esc(Number(yr)+543)}) <button class="lnk" style="margin-left:auto" onclick="openLeaveQuota()">ตั้งค่าโควตา</button>${canSeeMoney()?`<button class="lnk" onclick="openLeaveCarry()">ยกยอดข้ามปี</button>`:''}</div>

 html+=renderOtSection();

 html+=`<div class="pagehead" style="margin-top:22px"><div><h3 style="font-size:16px">ใบลาทั้งหมด</h3></div><button class="btn sm" onclick="openLeaveForm()">+ บันทึกวันลา</button></div>`;

    <td class="act">${act}</td></tr>`;

  html+=tbl(['พนักงาน','ประเภท','ช่วงวันที่',['จำนวนวัน','num'],'สถานะ','โน้ต',['จัดการ','act']], rows);
 }

 return html;
}

 save(); render();

/* ============ ก้อนที่ 15: แท็บเงินเดือน (payrolls) — snapshot ทั้งก้อนตอนสร้างงวด ============ */
/* net = ฐาน+OT+แพคเกจเพิ่ม(ทุกก้อน) − ปกส. − ภาษีหัก ณ ที่จ่าย − หักอื่นๆ(มือ) − แพคเกจหัก */
function payrollRowNet(r){ return r.salary+(Number(r.otAmt)||0)+(Number(r.addTaxable)||0)+(Number(r.addNonTaxable)||0)-r.ssoAmt-r.taxAmt-r.otherDeduct-(Number(r.packageDeduct)||0); }
(function seedPayroll(){
 if(db.demoCleared) return;
 if(db.payrolls.length || !db.staff.length) return;
 const ssoRate=5, ssoCap=750, ssoFloor=1650, ssoSalaryCap=15000;
 const period=thYear()+'-'+pad2(new Date().getMonth()+1);
 const rows=buildPayrollRows(period, ssoRate, ssoCap, ssoFloor, ssoSalaryCap).map(r=>({...r, net: payrollRowNet(r)}));
 db.payrolls.push({id:uid(), period, ssoRate, ssoCap, ssoFloor, ssoSalaryCap, rows, status:'ร่าง', paidAt:null});
 save();
})();

registerModule({key:'payroll', ic:'payroll', label:'เงินเดือน', render:renderPayroll});

function payrollNet(p){ return p.rows.reduce((s,r)=>s+(Number(r.net)||0),0); }

function renderPayroll(){
 let html=head('เงินเดือน','สร้างงวด → ตรวจสอบ → จ่ายงวด','openPayrollFormNew');
 if(!db.payrolls.length) return html+empty('ยังไม่มีงวดเงินเดือน กดปุ่ม + เพิ่ม');
 const rows=db.payrolls.slice().sort((a,b)=>b.period.localeCompare(a.period)).map(p=>{
  let act=`<button class="lnk" onclick="viewPayroll('${p.id}')">รายละเอียด</button>`;
  if(p.status==='ร่าง'){
   act+=`<button class="lnk" onclick="openPayrollForm('${p.id}')">แก้</button>`;
   act+=`<button class="lnk" style="color:var(--ok)" onclick="payPayroll('${p.id}')">จ่ายงวดนี้</button>`;
   act+=`<button class="lnk del" onclick="delPayroll('${p.id}')">ลบ</button>`;
  }
  return `<tr><td>${esc(p.period)}</td><td class="num">${p.rows.length} คน</td><td class="num">${baht(payrollNet(p))}</td><td><span class="chip c-${esc(p.status)}">${esc(p.status)}</span></td><td class="act">${act}</td></tr>`;
 }).join('');
 return html+tbl(['งวด',['จำนวนคน','num'],['ยอดจ่ายสุทธิ','num'],'สถานะ',['จัดการ','act']], rows);
}

/* เปลี่ยนงวดขณะ "สร้างงวดใหม่" (ยังไม่บันทึก) → คำนวณฐานค่าจ้าง/OT/แพคเกจใหม่ตามงวดนั้น — แก้งวดเดิม (มี id) ช่องงวดถูก disabled อยู่แล้วจึงไม่ถูกเรียก */
function recalcPayrollPeriod(){
 if(!window.__prIsNew) return;
 const period=val('prPeriod');
 const ssoRate=Number(val('prSsoRate'))||0, ssoCap=Number(val('prSsoCap'))||0, ssoFloor=Number(val('prSsoFloor'))||0, ssoSalaryCap=Number(val('prSsoSalaryCap'))||0;
 const rows=buildPayrollRows(period, ssoRate, ssoCap, ssoFloor, ssoSalaryCap);
 window.__prRows = rows.map(r=>({staffId:r.staffId, name:r.name, payType:r.payType, dailyRate:r.dailyRate, presentDays:r.presentDays, salary:r.salary, otHours:r.otHours, otAmt:r.otAmt, packageItems:r.packageItems, addTaxable:r.addTaxable, addNonTaxable:r.addNonTaxable, packageDeduct:r.packageDeduct, gross:r.gross}));
 rows.forEach(r=>{
  const wageCell=document.querySelector(`.pr-wage[data-staff="${r.staffId}"]`);
  if(wageCell) wageCell.textContent=baht(r.salary);
  const otCell=document.querySelector(`.pr-ot[data-staff="${r.staffId}"]`);
  if(otCell) otCell.textContent=baht(r.otAmt||0);
  const addCell=document.querySelector(`.pr-add[data-staff="${r.staffId}"]`);
  if(addCell){ addCell.dataset.add=(Number(r.addTaxable)||0)+(Number(r.addNonTaxable)||0); addCell.dataset.deduct=r.packageDeduct||0; addCell.textContent=baht(addCell.dataset.add)+' / -'+baht(addCell.dataset.deduct); }
  const ssoCell=document.querySelector(`.pr-sso[data-staff="${r.staffId}"]`);
  if(ssoCell){ ssoCell.dataset.gross=r.gross; ssoCell.textContent=baht(r.ssoAmt); }
  const taxEl=document.querySelector(`.pr-tax[data-staff="${r.staffId}"]`);
  if(taxEl) taxEl.value=r.taxAmt;
 });
}

function recalcPayrollSso(){
 const rate=Number(val('prSsoRate'))||0, cap=Number(val('prSsoCap'))||0, floor=Number(val('prSsoFloor'))||0, salCap=Number(val('prSsoSalaryCap'))||0;
 (window.__prRows||[]).forEach(r=>{
  const gross=r.gross;
  const ssoAmt=ssoOf(gross, rate, floor, salCap, cap);
  const cell=document.querySelector(`.pr-sso[data-staff="${r.staffId}"]`);
  if(cell) cell.textContent=baht(ssoAmt);
  const taxEl=document.querySelector(`.pr-tax[data-staff="${r.staffId}"]`);
  if(taxEl) taxEl.value=computePitMonthly(gross, ssoAmt);
 });
}

function savePayroll(id){
 const period=val('prPeriod');
 const ssoRate=Number(val('prSsoRate'))||0;
 const ssoCap=Number(val('prSsoCap'))||0;
 const ssoFloor=Number(val('prSsoFloor'))||0;
 const ssoSalaryCap=Number(val('prSsoSalaryCap'))||0;
 if(!period){ alert('กรอกงวดก่อน'); return; }
 const base=window.__prRows||[];
 const rows=base.map(b=>{
  const taxEl=document.querySelector(`.pr-tax[data-staff="${b.staffId}"]`);
  const otherEl=document.querySelector(`.pr-other[data-staff="${b.staffId}"]`);
  const taxAmt=Number(taxEl?taxEl.value:0)||0;
  const otherDeduct=Number(otherEl?otherEl.value:0)||0;
  const ssoAmt=ssoOf(b.gross, ssoRate, ssoFloor, ssoSalaryCap, ssoCap);
  const row={staffId:b.staffId, name:b.name, payType:b.payType, dailyRate:b.dailyRate, presentDays:b.presentDays, salary:b.salary, otHours:b.otHours, otAmt:b.otAmt,
   packageItems:b.packageItems, addTaxable:b.addTaxable, addNonTaxable:b.addNonTaxable, packageDeduct:b.packageDeduct, gross:b.gross,
   ssoRate, ssoFloor, ssoSalaryCap, ssoAmt, taxAmt, otherDeduct};
  row.net=payrollRowNet(row);
  return row;
 });
 if(id){
  const p=db.payrolls.find(x=>x.id===id);
  if(p && p.status==='ร่าง'){ p.period=period; p.ssoRate=ssoRate; p.ssoCap=ssoCap; p.ssoFloor=ssoFloor; p.ssoSalaryCap=ssoSalaryCap; p.rows=rows; }
 }else{
  db.payrolls.push({id:uid(), period, ssoRate, ssoCap, ssoFloor, ssoSalaryCap, rows, status:'ร่าง', paidAt:null});
 }
 save(); closeModal(); render();
}

/* ============ Export CSV เงินเดือน — ไฟล์จ่ายแบงก์ / ภ.ง.ด.1 / ปกส. (BOM กันไทยเพี้ยน — เตรียมให้นักบัญชี ไม่ใช่แบบยื่นจริง) ============ */
function csvDownload(filename, rows){
 const esc2=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const csv='﻿'+rows.map(r=>r.map(esc2).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url; a.download=filename;
 document.body.appendChild(a); a.click(); document.body.removeChild(a);
 URL.revokeObjectURL(url);
}
function exportPayrollBankCSV(id){
 const p=db.payrolls.find(x=>x.id===id);
 if(!p) return;
 const rows=[['ชื่อ-สกุล','ธนาคาร','เลขบัญชี','ยอดโอน (บาท)']];
 p.rows.forEach(r=>{

  rows.push([r.name, s?(s.bankName||''):'', s?(s.bankAccount||''):'', r.net]);
 });
 csvDownload('จ่ายเงินเดือน-'+p.period+'.csv', rows);
}

/* ============ v5 — A2: เตือนสำรองข้อมูล (แถบเหนือเนื้อหาทุกแท็บ โผล่เงียบ ๆ) ============ */
function hasTxnData(){
 return (db.products.length+db.moves.length+db.customers.length+db.orders.length+db.money.length+db.docs.length
  +db.staff.length+db.timelogs.length+db.leaves.length+db.otlogs.length+db.payrolls.length
  +(db.vendors?db.vendors.length:0)+(db.pos?db.pos.length:0)) > 0;
}
function needsBackupReminder(){
 if(!hasTxnData()) return false;
 if(!db.lastBackupAt) return true;
 const days=(Date.now()-new Date(db.lastBackupAt).getTime())/86400000;
 return days>7;
}
function backupBannerHtml(){

}

/* ============ v5 — A3: ค้นหากลาง (sidebar) — ลูกค้า/สินค้า/พนักงาน/เลขเอกสาร/ออเดอร์/ผู้ขาย/PO ============ */
let searchDebounceTimer=null;
function searchResults(q){
 q=String(q||'').trim();
 if(q.length<2) return [];
 const ql=q.toLowerCase();
 const out=[];
 db.customers.forEach(c=>{ if((c.name||'').toLowerCase().includes(ql)||(c.phone||'').includes(q)) out.push({ic:'customers', label:c.name, sub:'ลูกค้า', fn:`openCustomerDetail('${c.id}')`}); });
 db.products.forEach(p=>{ if((p.name||'').toLowerCase().includes(ql)||(p.sku||'').toLowerCase().includes(ql)) out.push({ic:'products', label:p.name, sub:'สินค้า'+(p.sku?' · '+p.sku:''), fn:`openProductDetail('${p.id}')`}); });
 db.staff.forEach(s=>{ if((s.name||'').toLowerCase().includes(ql)||(s.nickname||'').toLowerCase().includes(ql)) out.push({ic:'staff', label:s.name, sub:'พนักงาน', fn:`openStaffProfile('${s.id}')`}); });
 db.docs.forEach(d=>{ if((d.number||'').toLowerCase().includes(ql)) out.push({ic:'docs', label:d.number, sub:d.type, fn:`openDocDetail('${d.id}')`}); });
 db.orders.forEach(o=>{
  const c=db.customers.find(x=>x.id===o.customerId);
  const label='ออเดอร์ '+thDate(o.date)+(c?' · '+c.name:'');
  if(label.toLowerCase().includes(ql)) out.push({ic:'orders', label, sub:'ออเดอร์', fn:`openOrderDetail('${o.id}')`});
 });
 return out.slice(0,8);
}
function renderSearchDrop(q){
 const drop=document.getElementById('searchDrop');
 if(!drop) return;
 const results=searchResults(q);
 window.__searchResults=results;
 if(!String(q||'').trim() || String(q).trim().length<2){ drop.style.display='none'; drop.innerHTML=''; return; }
 if(!results.length){ drop.innerHTML=`<div class="search-empty">ไม่พบผลลัพธ์</div>`; drop.style.display='block'; return; }
 drop.innerHTML=results.map(r=>`<button type="button" class="search-item" onclick="${r.fn};closeSearchDrop()"><span class="ic">${icon(r.ic)}</span><span class="tx"><b>${esc(r.label)}</b><small>${esc(r.sub)}</small></span></button>`).join('');
 drop.style.display='block';
}
function onGlobalSearchInput(){
 const q=val('globalSearch');
 clearTimeout(searchDebounceTimer);
 searchDebounceTimer=setTimeout(()=>renderSearchDrop(q), 150);
}
function onGlobalSearchKey(e){
 if(e.key==='Escape'){ closeSearchDrop(); }
 else if(e.key==='Enter'){
  clearTimeout(searchDebounceTimer);
  renderSearchDrop(val('globalSearch'));
  const results=window.__searchResults||[];
  if(results.length){ (new Function(results[0].fn))(); closeSearchDrop(); }
 }
}
function closeSearchDrop(){
 const drop=document.getElementById('searchDrop');
 if(drop){ drop.style.display='none'; drop.innerHTML=''; }
 const inp=document.getElementById('globalSearch');
 if(inp) inp.value='';
 closeSidebar();
}

   <b style="color:var(--warn)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;vertical-align:-2px"><path d="M12 3 2 20h20z"/><path d="M12 9v5"/><path d="M12 17v.01"/></svg> ระบบจะลบข้อมูลตัวอย่างทั้งหมด</b>

    <b style="color:var(--ink)">ระบบจะดาวน์โหลดไฟล์สำรองข้อมูลเดิมให้อัตโนมัติก่อนลบเสมอ</b> — เผื่ออยากดูของเดโม่เดิมย้อนหลัง
   </div>
  </div>
  <div style="font-size:13.5px;color:var(--muted)">ตั้งค่าพื้นฐาน (กะทำงาน/โควตาลา) จะยังอยู่เหมือนเดิม — กดยืนยันแล้วจะพาไปกรอกข้อมูลกิจการทีละขั้นตอน</div>`,
  null, null, {foot:`<div class="mfoot"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn danger" onclick="savePress(this,'doGoLive')">ยืนยัน ล้างข้อมูล + เริ่มใช้จริง</button></div>`});
}
function doGoLive(){
 backupData(); // ⭐ auto-backup ไฟล์ JSON ของข้อมูลเดโม่ก่อนลบเสมอ
 ["products","moves","customers","orders","money","docs","vendors","pos","custody","staff","timelogs","leaves","otlogs","payrolls","holidays","monthCloses"].forEach(k=>{ db[k]=[]; });
 db.docCounters={};
 db.demoCleared=true;
 save();
 goliveStepIdx=0; goliveData={};
 openGoLiveWizardStep(0);
}
const GOLIVE_STEPS=['shopName','address','tax','vat','pay','work'];
let goliveStepIdx=0, goliveData={};
function openGoLiveWizardStep(idx){
 goliveStepIdx=idx;
 const total=GOLIVE_STEPS.length, key=GOLIVE_STEPS[idx];
 let title='', body='';
 if(key==='shopName'){ title='ชื่อกิจการของคุณ'; body=`<div class="fld"><label>ชื่อกิจการ/ร้าน</label><input id="wz_shopName" value="${esc(goliveData.shopName!==undefined?goliveData.shopName:(db.shopName||''))}" placeholder="เช่น JAMAREE GAS"></div>`; }
 else if(key==='address'){ title='ที่อยู่กิจการ'; body=`<div class="fld"><label>ที่อยู่ (สำหรับออกเอกสาร)</label><textarea id="wz_address" rows="3">${esc(goliveData.address||'')}</textarea></div>`; }
 else if(key==='tax'){ title='เลขผู้เสียภาษี + สาขา'; body=`<div class="fld"><label>เลขผู้เสียภาษี 13 หลัก (ไม่บังคับถ้ายังไม่จด)</label><input id="wz_taxId" value="${esc(goliveData.taxId||'')}" placeholder="เลข 13 หลัก"></div><div class="fld"><label>สาขา</label><input id="wz_branch" value="${esc(goliveData.branch||'สำนักงานใหญ่')}"></div>`; }
 else if(key==='vat'){ title='จดทะเบียน VAT ไหม?'; body=`
   <div class="fld"><label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="radio" name="wz_vat" value="1" style="width:auto" ${goliveData.vat?'checked':''}> จดแล้ว (ออกใบกำกับภาษี VAT 7%)</label></div>
   <div class="fld"><label style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="radio" name="wz_vat" value="0" style="width:auto" ${!goliveData.vat?'checked':''}> ยังไม่จด</label></div>`; }
 else if(key==='pay'){ title='พร้อมเพย์รับเงิน'; body=`<div class="fld"><label>เบอร์พร้อมเพย์ (ไม่บังคับ)</label><input id="wz_pp" value="${esc(goliveData.pp||'')}" placeholder="เช่น 0812345678"></div>`; }
 else if(key==='work'){ title='เวลาเข้างานปกติ'; body=`<div class="fld"><label>เวลาเข้างาน</label><input id="wz_workStart" type="time" value="${esc(goliveData.workStart||db.workStart||'09:00')}"></div>`; }
 const backBtn = idx>0 ? `<button class="btn ghost" onclick="goliveWizardBack()">← ย้อนกลับ</button>` : `<button class="btn ghost" onclick="render()">ยกเลิก</button>`;
 const nextBtn = idx<total-1 ? `<button class="btn" onclick="goliveWizardNext()">ถัดไป →</button>` : `<button class="btn" onclick="savePress(this,'goliveWizardFinish')">เสร็จสิ้น → ไปแดชบอร์ด</button>`;
 showFormPage(title, `ขั้นที่ ${idx+1}/${total} — ตั้งค่าเริ่มต้นกิจการ`, body, null, null, {foot:`<div class="mfoot" style="justify-content:space-between">${backBtn}${nextBtn}</div>`});
}
function goliveWizardReadCurrent(){
 const key=GOLIVE_STEPS[goliveStepIdx];
 if(key==='shopName') goliveData.shopName=val('wz_shopName');
 else if(key==='address') goliveData.address=val('wz_address');
 else if(key==='tax'){ goliveData.taxId=val('wz_taxId'); goliveData.branch=val('wz_branch'); }
 else if(key==='vat'){ const r=document.querySelector('input[name="wz_vat"]:checked'); goliveData.vat = r ? r.value==='1' : false; }
 else if(key==='pay') goliveData.pp=val('wz_pp');
 else if(key==='work') goliveData.workStart=val('wz_workStart');
}
function goliveWizardNext(){ goliveWizardReadCurrent(); if(goliveStepIdx<GOLIVE_STEPS.length-1) openGoLiveWizardStep(goliveStepIdx+1); }
function goliveWizardBack(){ goliveWizardReadCurrent(); if(goliveStepIdx>0) openGoLiveWizardStep(goliveStepIdx-1); }
function goliveWizardFinish(){
 goliveWizardReadCurrent();
 db.shopName = goliveData.shopName || 'JAMAREE GAS';
 db.bizInfo.address = goliveData.address || '';
 db.bizInfo.taxId = goliveData.taxId || '';
 db.bizInfo.branch = goliveData.branch || 'สำนักงานใหญ่';
 db.bizInfo.vatRegistered = !!goliveData.vat;
 db.bizInfo.promptpayMobile = goliveData.pp || '';
 db.workStart = goliveData.workStart || '09:00';
 goliveData={}; goliveStepIdx=0;
 save(); paintShop();
 cur='dash'; tabs(); render();
}

/* ====== ก้อนที่ 10 — สำรอง / นำเข้าข้อมูล (ปุ่มเครื่องมือบน header ไม่ใช่แท็บ) ====== */
function backupData(){
 const json=JSON.stringify(db,null,2);
 const blob=new Blob([json],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=`${(db.shopName||"JAMAREE GAS")}-${todayStr()}.json`;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 URL.revokeObjectURL(url);
 db.lastBackupAt=new Date().toISOString();
 save();
}
function importData(){
 document.getElementById("importFile").click();
}
function onImportFile(ev){
 const file=ev.target.files&&ev.target.files[0];
 if(!file) return;
 const reader=new FileReader();
 reader.onload=function(){
  let data;
  try{ data=JSON.parse(reader.result); }
  catch(e){ alert("ไฟล์ไม่ถูกต้อง"); ev.target.value=""; return; }
  if(!data||typeof data!=="object"){ alert("ไฟล์ไม่ถูกต้อง"); ev.target.value=""; return; }
  if(!confirm("นำเข้าจะทับข้อมูลเดิมทั้งหมด ยืนยันไหม?")){ ev.target.value=""; return; }
  db=data;
  normalizeDb();
  save();
  paintShop(); tabs(); render();
  ev.target.value="";
 };
 reader.onerror=function(){ alert("ไฟล์ไม่ถูกต้อง"); ev.target.value=""; };
 reader.readAsText(file);
}
/* ============ ก้อนที่ 16: บอร์ดงาน — งานทุกใบต้องมี "เจ้าของ + นาฬิกา" ============
   ⭐ กฎเหล็กที่บังคับตั้งแต่ตอนบันทึก ไม่ใช่แค่เตือนบนหน้าจอ:
      งานที่ไม่มีผู้รับผิดชอบ หรือไม่มีกำหนดส่ง = บันทึกไม่ผ่าน
      เพราะบอร์ดที่มีงานลอย ๆ ไม่มีเจ้าของ สุดท้ายไม่มีใครทำ แล้วบอร์ดก็ตาย
   บอร์ดนี้รวม 2 แหล่งไว้ที่เดียว ไม่สร้างข้อมูลซ้ำ:
      1) db.tasks  — งานทั่วไปที่สั่งกันในทีม
      2) db.orders — ออเดอร์ที่ยังไม่ปิด (map จาก workStage เดิม ไม่แตะ stockDeducted/status)
   ⚠ ห้ามคัดลอกออเดอร์มาเป็น task ตัวใหม่ ไม่งั้นสองที่จะไม่ตรงกัน */
const ORDER_STAGE_TO_TASK={"ใหม่":"รอทำ","กำลังทำ":"กำลังทำ","ส่งแล้ว":"รอตรวจ","ปิด":"เสร็จ"};
let boardFilter="";

function boardCards(){
 const vis=visibleStaffIds();
 const me=actingStaff();
 const out=[];
 db.tasks.forEach(t=>{
  if(me && !vis.includes(t.assigneeId)) return;
  if(boardFilter && t.assigneeId!==boardFilter) return;
  out.push({kind:"task", id:t.id, title:t.title, sub:t.detail||"", assigneeId:t.assigneeId, due:t.dueDate, status:t.status, priority:t.priority||"ปกติ"});
 });
 db.orders.forEach(o=>{
  const stage=o.workStage||"ใหม่";
  if(!o.assigneeId) return;                       // ออเดอร์ที่ยังไม่มอบหมาย ไม่ขึ้นบอร์ด (ไปมอบหมายในหน้าออเดอร์ก่อน)
  if(me && !vis.includes(o.assigneeId)) return;
  if(boardFilter && o.assigneeId!==boardFilter) return;
  const c=db.customers.find(x=>x.id===o.customerId);
  out.push({kind:"order", id:o.id, title:"ออเดอร์ "+(c?c.name:"—"), sub:baht(orderTotal(o)), assigneeId:o.assigneeId, due:o.date, status:ORDER_STAGE_TO_TASK[stage]||"รอทำ", priority:"ปกติ"});
 });
 return out;
}
function isOverdue(card){ return card.status!=="เสร็จ" && card.due && card.due < todayStr(); }

function renderBoard(){
 const people=db.staff.filter(s=>!s.terminatedAt && visibleStaffIds().includes(s.id));
 const filterOpts=`<option value="">ทุกคน</option>`+people.map(s=>`<option value="${s.id}" ${boardFilter===s.id?"selected":""}>${esc(s.name)}</option>`).join("");
 let html=`<div class="pagehead"><div><h2>บอร์ดงาน</h2><div class="sub">${currentRole()==="owner"?"งานทั้งบริษัท":(currentRole()==="manager"?"งานในแผนกของคุณ":"งานที่มอบหมายให้คุณ")}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
   <select class="sel" onchange="setBoardFilter(this.value)">${filterOpts}</select>
   <button class="btn" onclick="openTaskForm()">+ สั่งงาน</button>
  </div></div>`;
 const cards=boardCards();
 const late=cards.filter(isOverdue).length;
 if(late) html+=`<div class="card" style="background:#fef2f2;border-color:#fecaca;margin-bottom:14px"><b style="color:var(--danger)">⏰ เลยกำหนด ${late} งาน</b></div>`;
 html+=`<div class="boardwrap">`;
 TASK_STAGES.forEach(st=>{
  const col=cards.filter(c=>c.status===st);
  html+=`<div class="boardcol"><div class="bch">${esc(st)} <span class="bcount">${col.length}</span></div>`;
  html+= col.length ? col.map(c=>boardCardHtml(c)).join("") : `<div class="bempty">ว่าง</div>`;
  html+=`</div>`;
 });
 html+=`</div>`;
 return html;
}
function boardCardHtml(c){
 const who=staffName(c.assigneeId)||"—";
 const overdue=isOverdue(c);
 const open = c.kind==="order" ? `openOrderDetail('${c.id}')` : `openTaskForm('${c.id}')`;
 const nextIdx=TASK_STAGES.indexOf(c.status)+1;
 const nextBtn = (c.kind==="task" && nextIdx<TASK_STAGES.length)
  ? `<button class="lnk" onclick="event.stopPropagation();advanceTask('${c.id}')">→ ${esc(TASK_STAGES[nextIdx])}</button>` : "";
 return `<div class="bcard ${overdue?'late':''}" onclick="${open}">
   <div class="bt">${c.kind==="order"?`<span class="bico">${icon("orders",13)}</span>`:""}${esc(c.title)}</div>
   ${c.sub?`<div class="bs">${esc(c.sub)}</div>`:""}
   <div class="bmeta"><span class="chip">${esc(who)}</span>
    <span class="${overdue?'bdue late':'bdue'}">${c.due?thDate(c.due):"—"}</span></div>
   ${nextBtn?`<div style="margin-top:6px">${nextBtn}</div>`:""}
  </div>`;
}
function setBoardFilter(v){ boardFilter=v||""; render(); }
function advanceTask(id){
 const t=db.tasks.find(x=>x.id===id); if(!t) return;
 const i=TASK_STAGES.indexOf(t.status);
 if(i<0 || i>=TASK_STAGES.length-1) return;
 t.status=TASK_STAGES[i+1]; save(); render();
}
function openTaskForm(id){
 const t=id?db.tasks.find(x=>x.id===id):null;
 const stOpts=TASK_STAGES.map(s=>`<option value="${s}" ${t&&t.status===s?"selected":""}>${s}</option>`).join("");
 const prOpts=["ปกติ","ด่วน"].map(s=>`<option value="${s}" ${t&&t.priority===s?"selected":""}>${s}</option>`).join("");
 showFormPage(t?"แก้ไขงาน":"สั่งงานใหม่", "งานทุกใบต้องมีผู้รับผิดชอบและกำหนดส่ง", `
  <div class="fld"><label>เรื่อง</label><input id="tk_title" value="${t?esc(t.title):""}" placeholder="เช่น โทรตามลูกค้าค้างชำระ"></div>
  <div class="fld"><label>รายละเอียด</label><textarea id="tk_detail" rows="3" placeholder="ไม่ใส่ก็ได้">${t?esc(t.detail||""):""}</textarea></div>
  <div class="frow">
   <div class="fld"><label>ผู้รับผิดชอบ *</label><select id="tk_assignee">${activeStaffOptions(t?t.assigneeId:"")}</select></div>
   <div class="fld"><label>กำหนดส่ง *</label><input id="tk_due" type="date" value="${t?esc(t.dueDate||""):todayStr()}"></div>
  </div>
  <div class="frow">
   <div class="fld"><label>สถานะ</label><select id="tk_status">${stOpts}</select></div>
   <div class="fld"><label>ความสำคัญ</label><select id="tk_priority">${prOpts}</select></div>
  </div>
  ${t?`<button class="btn danger" style="margin-top:6px" onclick="delRow('tasks','${t.id}')">ลบงานนี้</button>`:""}
 `, "saveTask", id||"");
}
function saveTask(id){
 const title=val("tk_title"), assigneeId=val("tk_assignee"), dueDate=val("tk_due");
 if(!title){ alert("ใส่เรื่องของงานก่อน"); return; }
 // ⭐ ด่านจริง ไม่ใช่แค่ดาวแดงข้างช่อง — ไม่มีเจ้าของ/ไม่มีกำหนดส่ง = ไม่ให้บันทึก
 if(!assigneeId){ alert("ต้องระบุผู้รับผิดชอบ — งานที่ไม่มีเจ้าของจะไม่มีใครทำ"); return; }
 if(!dueDate){ alert("ต้องระบุกำหนดส่ง — งานที่ไม่มีนาฬิกาจะค้างบอร์ดไปเรื่อย ๆ"); return; }
 const t=id?db.tasks.find(x=>x.id===id):null;
 const data={title, detail:val("tk_detail"), assigneeId, dueDate, status:val("tk_status")||TASK_STAGES[0], priority:val("tk_priority")||"ปกติ"};
 if(t) Object.assign(t,data);
 else db.tasks.unshift(Object.assign({id:uid(), createdAt:todayStr()}, data));
 save(); closeModal();
}
registerModule({key:'board', ic:'board', label:'บอร์ดงาน', render:renderBoard});

/* ============ ก้อนที่ 17: ทะเบียนตำแหน่ง & JD ============
   ตำแหน่ง = "หน้าที่ขององค์กร" (มีอยู่แม้ยังไม่มีคนถือ) ต่างจาก staff.role ที่เป็นแค่ข้อความบนนามบัตร
   ⭐ ลบตำแหน่งที่ยังมีคนถืออยู่ไม่ได้ — ไม่งั้นพนักงานจะชี้ไปตำแหน่งที่ไม่มีตัวตน */
function positionName(id){ const p=db.positions.find(x=>x.id===id); return p?p.name:''; }
function positionHolders(id){ return db.staff.filter(s=>s.positionId===id && !s.terminatedAt); }
function positionOptions(selected){
 return `<option value="">— ยังไม่กำหนด —</option>`+db.positions.map(p=>
  `<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}${p.dept?' · '+esc(p.dept):''}</option>`).join('');
}
function renderPositions(){
 let html=head('ตำแหน่ง & JD','หน้าที่ในองค์กร — ใช้เป็นฐานของสิทธิ์และการประเมิน', canSeeMoney()?'openPositionForm':'');
 if(!db.positions.length) return html+empty('ยังไม่มีตำแหน่ง — กดปุ่ม + เพิ่ม แล้วใส่หน้าที่ของตำแหน่งนั้น');
 const rows=db.positions.map(p=>{
  const holders=positionHolders(p.id);
  return `<tr>
   <td><button class="lnk" style="padding:0;font-weight:600;color:var(--ink)" onclick="openPositionDetail('${p.id}')">${esc(p.name)}</button></td>
   <td>${p.dept?esc(p.dept):'—'}</td>
   <td class="num">${holders.length}</td>
   <td>${holders.length?holders.map(h=>esc(h.name)).join(', '):'<span style="color:var(--warn)">ยังไม่มีคนถือตำแหน่ง</span>'}</td>
   <td class="act">${canSeeMoney()?`<button class="lnk" onclick="openPositionForm('${p.id}')">แก้</button>
    <button class="lnk del" onclick="delPosition('${p.id}')">ลบ</button>`:'—'}</td>
  </tr>`;
 }).join('');
 return html+tbl(['ตำแหน่ง','แผนก',['จำนวนคน','num'],'ใครถืออยู่',['จัดการ','act']], rows);
}
function openPositionDetail(id){
 const p=db.positions.find(x=>x.id===id); if(!p) return;
 const holders=positionHolders(id);
 const duties=(p.duties||[]).filter(Boolean);
 showDetailPage(p.name, p.dept||'', `
  <div class="fld"><label>สรุปหน้าที่ (JD)</label><div style="white-space:pre-wrap;font-size:13.5px">${p.jd?esc(p.jd):'<span style="color:var(--faint)">ยังไม่ได้เขียน</span>'}</div></div>
  <div class="fld"><label>ความรับผิดชอบหลัก</label>${duties.length?`<ol style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.8">${duties.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`:'<span style="color:var(--faint)">ยังไม่ได้ใส่</span>'}</div>
  <div class="fld" style="margin-bottom:0"><label>คนที่ถือตำแหน่งนี้</label>${holders.length?holders.map(h=>`<button class="lnk" onclick="openStaffProfile('${h.id}')">${esc(h.name)}</button>`).join(' · '):'<span style="color:var(--warn)">ยังไม่มีคนถือตำแหน่ง</span>'}</div>
 `, {backFn:"setStaffTab('positions')", actions: canSeeMoney()?`<button class="btn ghost sm" onclick="openPositionForm('${id}')">แก้ไข</button>`:''});
}
function openPositionForm(id){
 const p=id?db.positions.find(x=>x.id===id):null;
 showFormPage(p?'แก้ไขตำแหน่ง':'เพิ่มตำแหน่ง','', `
  <div class="frow">
   <div class="fld"><label>ชื่อตำแหน่ง</label><input id="ps_name" value="${p?esc(p.name):''}" placeholder="เช่น หัวหน้าฝ่ายขาย"></div>
   <div class="fld"><label>แผนก</label><input id="ps_dept" value="${p?esc(p.dept||''):''}" placeholder="เช่น ขาย"></div>
  </div>
  <div class="fld"><label>สรุปหน้าที่ (JD)</label><textarea id="ps_jd" rows="4" placeholder="ตำแหน่งนี้มีไว้ทำอะไร รับผิดชอบผลลัพธ์อะไร">${p?esc(p.jd||''):''}</textarea></div>
  <div class="fld"><label>ความรับผิดชอบหลัก (บรรทัดละข้อ)</label><textarea id="ps_duties" rows="5" placeholder="ปิดยอดขายรายเดือน&#10;ดูแลลูกค้าเก่า&#10;ทำรายงานให้เจ้าของทุกวันจันทร์">${p?esc((p.duties||[]).join('\n')):''}</textarea></div>
 `, 'savePosition', id||'');
}
function savePosition(id){
 const name=val('ps_name');
 if(!name){ alert('ใส่ชื่อตำแหน่งก่อน'); return; }
 const duties=(document.getElementById('ps_duties').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
 const data={name, dept:val('ps_dept'), jd:(document.getElementById('ps_jd').value||'').trim(), duties};
 const p=id?db.positions.find(x=>x.id===id):null;
 if(p) Object.assign(p,data); else db.positions.push(Object.assign({id:uid()},data));
 save(); closeModal();
}
function delPosition(id){
 const holders=positionHolders(id);
 if(holders.length){ alert('ลบไม่ได้ — ยังมี '+holders.length+' คนถือตำแหน่งนี้อยู่ ('+holders.map(h=>h.name).join(', ')+')\nย้ายพวกเขาไปตำแหน่งอื่นก่อน'); return; }
 if(!confirm('ลบตำแหน่งนี้?')) return;
 db.positions=db.positions.filter(x=>x.id!==id); save(); render();
}

/* ============ ก้อนที่ 18: ประวัติการปรับเงินเดือน ============
   ⭐ ปรับเงินเดือนต้องทิ้งร่องรอยเสมอ (ขึ้นเมื่อไร จากเท่าไรเป็นเท่าไร เพราะอะไร)
   ⚠ ไม่กระทบงวดเงินเดือนที่ปิดไปแล้ว — payrolls.rows เป็น snapshot ตอนสร้างงวด อ่านจาก db.staff อีกทีไม่ได้ */
function openSalaryRaise(id){
 const s=db.staff.find(x=>x.id===id); if(!s) return;
 const isDaily=s.payType==='รายวัน';
 const curAmt=isDaily?(s.dailyRate||0):(s.salary||0);
 showFormPage('ปรับค่าจ้าง — '+s.name, (isDaily?'ค่าแรงรายวัน':'เงินเดือน')+'ปัจจุบัน '+baht(curAmt), `
  <div class="frow">
   <div class="fld"><label>มีผลวันที่</label><input id="sr_date" type="date" value="${todayStr()}"></div>
   <div class="fld"><label>${isDaily?'ค่าแรงรายวันใหม่':'เงินเดือนใหม่'}</label><input id="sr_amount" type="number" value="${curAmt}"></div>
  </div>
  <div class="fld"><label>เหตุผล</label><input id="sr_reason" placeholder="เช่น ปรับประจำปี / ผ่านทดลองงาน / เลื่อนตำแหน่ง"></div>
  <div class="rolewarn" style="margin-top:4px">งวดเงินเดือนที่สร้างไปแล้วจะไม่เปลี่ยนตาม — ตัวเลขในงวดเก่าถูกแช่แข็งไว้ตอนสร้างงวดนั้น</div>
 `, 'saveSalaryRaise', id);
}
function saveSalaryRaise(id){
 const s=db.staff.find(x=>x.id===id); if(!s) return;
 const isDaily=s.payType==='รายวัน';
 const from=isDaily?(s.dailyRate||0):(s.salary||0);
 const to=Number(val('sr_amount'))||0;
 const date=val('sr_date')||todayStr();
 if(to<=0){ alert('ใส่จำนวนเงินให้ถูกต้อง'); return; }
 if(to===from){ alert('จำนวนเงินเท่าเดิม ไม่มีอะไรให้บันทึก'); return; }
 s.salaryHistory=s.salaryHistory||[];
 s.salaryHistory.unshift({id:uid(), date, from, to, reason:val('sr_reason')||'', payType:s.payType});
 if(isDaily) s.dailyRate=to; else s.salary=to;
 save(); closeModal(); openStaffProfile(id);
}
function salaryHistoryHtml(s){
 const h=(s.salaryHistory||[]);
 const btn=canSeeMoney()?`<button class="btn ghost sm" onclick="openSalaryRaise('${s.id}')">ปรับค่าจ้าง</button>`:'';
 if(!h.length) return `<div class="fld"><label>ประวัติการปรับค่าจ้าง</label><div style="color:var(--faint);font-size:13px;margin-bottom:8px">ยังไม่เคยปรับ</div>${btn}</div>`;
 const rows=h.map(r=>`<tr><td>${thDate(r.date)}</td><td class="num">${baht(r.from)}</td><td class="num">${baht(r.to)}</td>
   <td class="num ${r.to>=r.from?'money-pos':'money-neg'}">${r.to>=r.from?'+':'−'}${baht(Math.abs(r.to-r.from))}</td>
   <td>${r.reason?esc(r.reason):'—'}</td></tr>`).join('');
 return `<div class="fld"><label>ประวัติการปรับค่าจ้าง (${h.length} ครั้ง)</label>
  ${tbl(['วันที่',['จาก','num'],['เป็น','num'],['ต่าง','num'],'เหตุผล'], rows)}<div style="margin-top:8px">${btn}</div></div>`;
}

/* ============ ก้อนที่ 19: ยกยอดวันลาข้ามปี ============
   ⭐ ยกยอดได้เฉพาะวันลาที่ "เหลือจริง" และไม่เกินเพดานที่ตั้งไว้ (db.leaveCarryCap)
   ⭐ ยกซ้ำปีเดิมไม่ได้ — กันกดสองรอบแล้ววันลางอกเอง */
function leaveCarryFor(staffId, year, type){
 const r=db.leaveCarry.find(x=>x.staffId===staffId && x.year===year && x.type===type);
 return r?Number(r.days)||0:0;
}
function hasCarried(year){ return db.leaveCarry.some(x=>x.year===year); }
function openLeaveCarry(){
 const thisYear=new Date().getFullYear();
 const fromYear=thisYear-1;
 const already=hasCarried(thisYear);
 const rows=db.staff.filter(s=>!s.terminatedAt).map(s=>{
  const cells=db.leaveTypes.map(t=>{
   const quota=(s.leaveQuotaOverride&&s.leaveQuotaOverride[t]!==undefined)?s.leaveQuotaOverride[t]:(db.leaveQuota[t]||0);
   const used=db.leaves.filter(l=>l.staffId===s.id && l.type===t && l.status==='อนุมัติ' && String(l.dateFrom||'').slice(0,4)===String(fromYear)).reduce((a,l)=>a+(Number(l.days)||0),0);
   const left=Math.max(0, quota-used);
   const carry=Math.min(left, db.leaveCarryCap);
   return `<td class="num">${left} → <b>${carry}</b></td>`;
  }).join('');
  return `<tr><td>${esc(s.name)}</td>${cells}</tr>`;
 }).join('');
 showFormPage('ยกยอดวันลาข้ามปี', `ยกวันลาที่เหลือของปี ${fromYear+543} มาใช้ต่อในปี ${thisYear+543}`, `
  <div class="fld"><label>เพดานยกยอดต่อประเภท (วัน)</label><input id="lc_cap" type="number" value="${db.leaveCarryCap}"></div>
  ${tbl(['พนักงาน'].concat(db.leaveTypes.map(t=>[t,'num'])), rows)}
  <div class="rolewarn" style="margin-top:10px">ตัวเลขซ้ายคือวันลาที่เหลือจริงของปี ${fromYear+543} · ตัวหนาคือจำนวนที่จะยกมาให้จริงหลังตัดด้วยเพดาน</div>
  ${already?`<div class="rolewarn" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">ปี ${thisYear+543} ยกยอดไปแล้ว — กดอีกครั้งจะไม่มีผล (กันวันลางอกจากการกดซ้ำ)</div>`:''}
 `, 'saveLeaveCarry', '', {wide:true});
}
function saveLeaveCarry(){
 const thisYear=new Date().getFullYear(), fromYear=thisYear-1;
 const cap=Math.max(0, Number(val('lc_cap'))||0);
 db.leaveCarryCap=cap;
 if(hasCarried(thisYear)){ alert('ปีนี้ยกยอดไปแล้ว ยกซ้ำไม่ได้'); save(); closeModal(); return; }
 db.staff.filter(s=>!s.terminatedAt).forEach(s=>{
  db.leaveTypes.forEach(t=>{
   const quota=(s.leaveQuotaOverride&&s.leaveQuotaOverride[t]!==undefined)?s.leaveQuotaOverride[t]:(db.leaveQuota[t]||0);
   const used=db.leaves.filter(l=>l.staffId===s.id && l.type===t && l.status==='อนุมัติ' && String(l.dateFrom||'').slice(0,4)===String(fromYear)).reduce((a,l)=>a+(Number(l.days)||0),0);
   const carry=Math.min(Math.max(0,quota-used), cap);
   if(carry>0) db.leaveCarry.push({id:uid(), staffId:s.id, year:thisYear, type:t, days:carry, fromYear});
  });
 });
 save(); closeModal();
}

</script>
