<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>JAMAREE GAS — ระบบจัดการร้าน</title>
    <script>
      // ทาสีโหมดมืดก่อนวาดหน้าจอ — กันจอกะพริบขาวแวบหนึ่งตอนเปิดแอป
      (function () {
        try {
          var saved = localStorage.getItem("jamaree_theme");
          var dark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* เปิดแบบไม่มีที่เก็บข้อมูลก็ใช้โหมดสว่างไปตามปกติ */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
